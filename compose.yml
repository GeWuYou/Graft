services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${COMPOSE_FILE_DIR:-.}/.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      GRAFT_REDIS_PASSWORD: ${GRAFT_REDIS_PASSWORD:-}
    command:
      - sh
      - -ec
      - |
        if [ -n "$${GRAFT_REDIS_PASSWORD:-}" ]; then
          exec redis-server --save "" --appendonly no --requirepass "$${GRAFT_REDIS_PASSWORD}"
        fi
        exec redis-server --save "" --appendonly no
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$${GRAFT_REDIS_PASSWORD:-}" ]; then
            REDISCLI_AUTH="$${GRAFT_REDIS_PASSWORD}" redis-cli ping
          else
            redis-cli ping
          fi
      interval: 5s
      timeout: 3s
      retries: 10

  bootstrap:
    image: ${GRAFT_SERVER_IMAGE:?GRAFT_SERVER_IMAGE is required}
    restart: "no"
    env_file:
      - .env
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GRAFT_APP_ENV: ${GRAFT_APP_ENV:-production}
      GRAFT_DATABASE_URL: ${GRAFT_DATABASE_URL:-host=postgres port=5432 dbname=${POSTGRES_DB} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} sslmode=disable}
      GRAFT_REDIS_ADDR: ${GRAFT_REDIS_ADDR:-redis:6379}
      GRAFT_AUTH_JWT_SECRET: ${GRAFT_AUTH_JWT_SECRET}
      GRAFT_HTTPX_WEBSOCKET_ALLOWED_ORIGINS: ${GRAFT_HTTPX_WEBSOCKET_ALLOWED_ORIGINS:-http://127.0.0.1:${GRAFT_WEB_HOST_PORT:-3000},http://localhost:${GRAFT_WEB_HOST_PORT:-3000}}

  application-root-init:
    image: ${GRAFT_SERVER_IMAGE:?GRAFT_SERVER_IMAGE is required}
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -eux
        mkdir -p /opt/graft/apps
        chown 10001:10001 /opt/graft/apps
        chmod 0750 /opt/graft/apps
        test "$(stat -c '%u:%g' /opt/graft/apps)" = "10001:10001"
        test "$(stat -c '%a' /opt/graft/apps)" = "750"
    volumes:
      - ${GRAFT_APPLICATION_ROOT_HOST_PATH:-/opt/graft/apps}:/opt/graft/apps

  backup-root-init:
    image: ${GRAFT_SERVER_IMAGE:?GRAFT_SERVER_IMAGE is required}
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -eu
        mkdir -p "${GRAFT_BACKUP_ARTIFACT_ROOT:-/var/lib/graft/backups}"
        chown 10001:10001 "${GRAFT_BACKUP_ARTIFACT_ROOT:-/var/lib/graft/backups}"
        chmod 0700 "${GRAFT_BACKUP_ARTIFACT_ROOT:-/var/lib/graft/backups}"
    volumes:
      - ${GRAFT_BACKUP_ARTIFACT_HOST_PATH:-/opt/graft/backups}:${GRAFT_BACKUP_ARTIFACT_ROOT:-/var/lib/graft/backups}

  server:
    image: ${GRAFT_SERVER_IMAGE:?GRAFT_SERVER_IMAGE is required}
    restart: unless-stopped
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -S /var/run/docker.sock ]; then
          sock_gid="$$(stat -c '%g' /var/run/docker.sock)"
          sock_group="$$(awk -F: -v gid="$$sock_gid" '$$3 == gid { print $$1; exit }' /etc/group)"
          if [ -z "$$sock_group" ]; then
            addgroup -S -g "$$sock_gid" dockerhost
            sock_group=dockerhost
          fi
          addgroup graft "$$sock_group"
        fi
        exec su graft -s /bin/sh -c '/app/graft serve'
    env_file:
      - .env
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      application-root-init:
        condition: service_completed_successfully
      backup-root-init:
        condition: service_completed_successfully
    environment:
      GRAFT_APP_ENV: ${GRAFT_APP_ENV:-production}
      GRAFT_HTTP_ADDR: ${GRAFT_HTTP_ADDR:-:8080}
      GRAFT_DATABASE_URL: ${GRAFT_DATABASE_URL:-host=postgres port=5432 dbname=${POSTGRES_DB} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} sslmode=disable}
      GRAFT_REDIS_ADDR: ${GRAFT_REDIS_ADDR:-redis:6379}
      GRAFT_AUTH_JWT_SECRET: ${GRAFT_AUTH_JWT_SECRET}
      GRAFT_HTTPX_WEBSOCKET_ALLOWED_ORIGINS: ${GRAFT_HTTPX_WEBSOCKET_ALLOWED_ORIGINS:-http://127.0.0.1:${GRAFT_WEB_HOST_PORT:-3000},http://localhost:${GRAFT_WEB_HOST_PORT:-3000}}
      GRAFT_PROJECT_IMPORT_DEFAULT_PATH: ${GRAFT_PROJECT_IMPORT_DEFAULT_PATH:-}
      GRAFT_PROJECT_IMPORT_CONTAINER_PATH: ${GRAFT_PROJECT_IMPORT_CONTAINER_PATH:-/srv/graft-imports}
    expose:
      - "${GRAFT_SERVER_EXPOSE_PORT:-8080}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GRAFT_PROJECT_IMPORT_HOST_PATH:-./.data/imports}:${GRAFT_PROJECT_IMPORT_CONTAINER_PATH:-/srv/graft-imports}:ro
      - ${GRAFT_APPLICATION_ROOT_HOST_PATH:-/opt/graft/apps}:/opt/graft/apps
      - ${GRAFT_BACKUP_ARTIFACT_HOST_PATH:-/opt/graft/backups}:${GRAFT_BACKUP_ARTIFACT_ROOT:-/var/lib/graft/backups}

  web:
    image: ${GRAFT_WEB_IMAGE:?GRAFT_WEB_IMAGE is required}
    restart: unless-stopped
    environment:
      GRAFT_SERVER_UPSTREAM: ${GRAFT_SERVER_UPSTREAM:-http://server:8080}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${GRAFT_WEB_HOST_PORT:-3000}:80"
