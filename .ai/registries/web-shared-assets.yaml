schema_version: 1
updated_at: "2026-07-13"
assets:
  - name: "responsive-sidebar"
    type: "frontend-component"
    path: "web/src/shared/components/responsive/ResponsiveSidebar.vue"
    owner: "web/shared"
    purpose: "Shell navigation surface that renders a desktop rail, compact tablet rail, or controlled mobile Drawer through slots."
    use_when:
      - "A shell-owned navigation surface must switch presentation by container width without duplicating navigation data or route handling."
    do_not_use_when:
      - "A module-private drawer or a business-specific side panel is needed."
    examples:
      - "web/src/layouts/components/LayoutSideNav.vue"
    validation_commands:
      - "cd web && bun run check"

  - name: "responsive-layout-primitives"
    type: "frontend-component-suite"
    path: "web/src/shared/components/responsive"
    owner: "web/shared"
    purpose: "Container-first responsive page primitives, including an explicit shared viewport-density exception for resource tables whose product contract is defined by viewport breakpoints."
    use_when:
      - "A shared page primitive must select a token-driven layout without exposing device booleans to business modules."
      - "A resource table has an explicit product viewport breakpoint that remains stable despite shell navigation consuming page width."
    do_not_use_when:
      - "A module page can use its own container density or needs page-local viewport detection."
    examples:
      - "web/src/shared/components/management/ManagementPagedTable.vue"
      - "web/src/modules/container/pages/images/index.vue"
    validation_commands:
      - "cd web && bun run check"

  - name: "management-components"
    type: "frontend-component-suite"
    path: "web/src/shared/components/management"
    owner: "web/shared"
    purpose: "Reusable management page table surfaces, pagination, action menus, column helpers, and compact timestamp helpers. Management pagination uses page sizes 10, 20, 50, and 100 only."
    use_when:
      - "Building module management list pages with TDesign tables, actions, or pagination."
    do_not_use_when:
      - "The surface is not a management/list page or carries module-private business semantics."
      - "Defining a module-private pagination control or inconsistent page-size option array; reuse ManagementTablePagination or ManagementPagedTable."
    examples:
      - "web/src/modules/user/pages/index.vue"
      - "web/src/modules/rbac/pages/index.vue"
      - "web/src/modules/system-config/pages/list/index.vue"
    related_assets:
      - "observability-helpers"
      - "query-list-components"
    validation_commands:
      - "cd web && bun run check"

  - name: "card-surface-mixins"
    type: "frontend-utility"
    path: "web/src/shared/components/card-surface.less"
    owner: "web/shared"
    purpose: "Token-driven base and entity card-surface LESS mixins for shared and module-owned operational cards."
    use_when:
      - "A card surface is reused by multiple modules and needs the standard Graft token border and background treatment."
    do_not_use_when:
      - "The surface has module-private visual semantics that cannot share a base card treatment."
    examples:
      - "web/src/modules/container/pages/list/ContainerCard.vue"
      - "web/src/modules/runtime-target/pages/list/index.vue"
    validation_commands:
      - "cd web && bun run check"

  - name: "query-list-components"
    type: "frontend-component-suite"
    path: "web/src/shared/components/query-list"
    owner: "web/shared"
    purpose: "Advanced query list page, filter builder, saved-query-view control, column drawer, and paged table components for log-style list/detail workflows."
    use_when:
      - "Building searchable list pages with URL-backed filters, server-persisted private query views, sorters, column visibility, or detail drawer coupling."
    do_not_use_when:
      - "The page has a simple static table and does not need advanced query state."
    examples:
      - "web/src/modules/audit/pages/logs/index.vue"
      - "web/src/modules/access-log/pages/list/index.vue"
      - "web/src/modules/app-log/pages/list/index.vue"
    related_assets:
      - "management-components"
      - "observability-helpers"
    validation_commands:
      - "cd web && bun run check"

  - name: "menu-icon-resolver"
    type: "frontend-component"
    path: "web/src/shared/icons"
    owner: "web/shell"
    purpose: "One static Iconify resolver for server-owned menu icon identifiers, with Lucide defaults and brand icon support."
    use_when:
      - "Rendering server descriptor menu icons in the shell without runtime icon-network loading."
    do_not_use_when:
      - "Rendering module-private status glyphs or page-local illustrative icons."
    examples:
      - "web/src/layouts/components/MenuContent.vue"
    related_assets:
      - "route-bootstrap-utils"
    validation_commands:
      - "cd web && bun run check"

  - name: "schema-form-renderers"
    type: "frontend-component-suite"
    path: "web/src/shared/schema-form"
    owner: "web/shared"
    purpose: "Schema-driven system config editor and value renderer helpers for supported JSON schema subsets."
    use_when:
      - "Rendering or editing system config values from backend-owned config schema."
    do_not_use_when:
      - "Rendering arbitrary business JSON that is not a system config schema contract."
    examples:
      - "web/src/modules/system-config/pages/list/index.vue"
    related_assets:
      - "system-config-field-renderer-skill"
    validation_commands:
      - "cd web && bun run check"

  - name: "observability-helpers"
    type: "frontend-utility"
    path: "web/src/shared/observability"
    owner: "web/shared"
    purpose: "Locale-aware log timestamps, log and JSON viewers, resource formatting, deep-link query helpers, copy helpers, list error/interaction helpers, and sorters."
    use_when:
      - "Building access log, app log, audit, container, dashboard, or monitor UI that consumes observability contracts or needs read-only log/JSON troubleshooting surfaces."
    do_not_use_when:
      - "The logic is a module-private business presenter with domain-specific labels."
    examples:
      - "web/src/modules/access-log/contract/deep-link.ts"
      - "web/src/modules/app-log/contract/deep-link.ts"
      - "web/src/modules/dashboard/pages/index.vue"
    related_assets:
      - "openapi-contracts"
      - "management-components"
    validation_commands:
      - "cd web && bun run check"

  - name: "task-runtime-client"
    type: "frontend-contract"
    path: "web/src/modules/task"
    owner: "module:task"
    purpose: "Generic Task detail, owner-scoped history lookup, and realtime-plus-polling task observation for modules that submit asynchronous work."
    use_when:
      - "A module receives a Task receipt and needs to show or observe durable task state without owning Task transport internals."
    do_not_use_when:
      - "Tracking a module-specific resource snapshot that is not represented by the Task Runtime."
    examples:
      - "web/src/modules/project/pages/list/index.vue"
    related_assets:
      - "observability-helpers"
      - "openapi-contracts"
    validation_commands:
      - "cd web && bun run check"

  - name: "metric-components"
    type: "frontend-component-suite"
    path: "web/src/shared/components/metrics"
    owner: "web/shared"
    purpose: "Reusable compact metric cards and realtime resource meters for resource snapshots and operational status summaries."
    use_when:
      - "Building module pages that need token-driven CPU, memory, status, or other compact operational metric summaries."
    do_not_use_when:
      - "The metric carries module-private business semantics that need a local presenter or specialized layout."
    examples:
      - "web/src/modules/container/pages/detail/index.vue"
    notes:
      - "Metric components may be composed near observability helpers, but they do not depend on observability-helper APIs."
    validation_commands:
      - "cd web && bun run check"

  - name: "terminal-components"
    type: "frontend-component-suite"
    path: "web/src/shared/components/terminal"
    owner: "web/shared"
    purpose: "Reusable xterm-based interactive terminal surface, transport session helper, and terminal theme wiring for shell-style streaming workflows."
    use_when:
      - "Building an interactive terminal or shell surface that needs reusable WebSocket session transport without module-specific Docker semantics."
    do_not_use_when:
      - "The UI only needs static log output, JSON inspection, or a module-private command runner with business-specific transport rules."
    examples:
      - "web/src/modules/container/components/ContainerShellPanel.vue"
    related_assets:
      - "observability-helpers"
    validation_commands:
      - "cd web && bun run check"

  - name: "refresh-control-components"
    type: "frontend-component"
    path: "web/src/shared/components/refresh"
    owner: "web/shared"
    purpose: "Reusable refresh control bar for auto-refresh cadence, optional trend window, manual refresh, and pause/resume actions."
    use_when:
      - "Building monitoring or detail pages that need consistent refresh cadence and manual refresh controls without owning timer behavior inside the component."
    do_not_use_when:
      - "The control triggers business-specific refresh side effects internally or needs module-private state management."
    examples:
      - "web/src/modules/monitor/pages/overview/index.vue"
      - "web/src/modules/container/pages/detail/index.vue"
    related_assets:
      - "metric-components"
    validation_commands:
      - "cd web && bun run check"

  - name: "shared-page-header"
    type: "frontend-component"
    path: "web/src/shared/components/page"
    owner: "web/shared"
    purpose: "Reusable page header with i18n key-first title, description, breadcrumbs, and source metadata."
    use_when:
      - "A page needs a shared header with key-first i18n and shell-compatible metadata."
    do_not_use_when:
      - "The header is a module-specific visual composition that should stay local."
    examples:
      - "web/src/shared/components/page/PageHeader.vue"
    related_assets:
      - "frontend-i18n-governance"
    validation_commands:
      - "cd web && bun run check"

  - name: "assignment-components"
    type: "frontend-component-suite"
    path: "web/src/shared/components/assignment"
    owner: "web/shared"
    purpose: "Reusable assignment drawer/card/grid/toolbar components for assigning related entities."
    use_when:
      - "Building an assignment workflow with selection, summary, and drawer-style confirmation."
    do_not_use_when:
      - "The assignment flow has module-specific semantics that require a local component."
    examples:
      - "web/src/shared/components/assignment/AssignmentDrawer.test.ts"
    related_assets:
      - "document-fullscreen-composable"
    validation_commands:
      - "cd web && bun run check"

  - name: "assignment-selection-composable"
    type: "frontend-composable"
    path: "web/src/shared/composables/useAssignmentSelection.ts"
    owner: "web/shared"
    purpose: "Reusable selection state for assignment-style UI flows."
    use_when:
      - "Managing selected/unselected entities in a shared assignment surface."
    do_not_use_when:
      - "Selection is page-local and does not follow the assignment workflow pattern."
    examples:
      - "web/src/shared/components/assignment/AssignmentDrawer.test.ts"
    related_assets:
      - "assignment-components"
    validation_commands:
      - "cd web && bun run check"

  - name: "keyboard-shortcut-composable"
    type: "frontend-composable"
    path: "web/src/shared/composables/useKeyboardShortcut.ts"
    owner: "web/shared"
    purpose: "Lifecycle-safe tinykeys adapter for scoped keyboard shortcuts with reactive enablement and optional browser-default suppression."
    use_when:
      - "Project, Announcement, or ContentViewerFrame needs a common keyboard shortcut without handwritten window keydown listeners."
    do_not_use_when:
      - "The event is not a keyboard shortcut or carries module-private shortcut semantics that cannot be expressed by a callback."
    related_assets:
      - "assignment-selection-composable"
    validation_commands:
      - "cd web && bun run check"

  - name: "document-fullscreen-composable"
    type: "frontend-composable"
    path: "web/src/shared/composables/useDocumentFullscreen.ts"
    owner: "web/shared"
    purpose: "SSR-safe browser Fullscreen API adapter with reactive document state and lifecycle-safe operations for shell and reusable viewer surfaces."
    use_when:
      - "A shell or shared surface needs to enter, exit, or observe browser document fullscreen without owning API event lifecycle."
    do_not_use_when:
      - "The feature is only a component-local visual layout state and does not use the browser Fullscreen API."
    related_assets:
      - "keyboard-shortcut-composable"
    validation_commands:
      - "cd web && bun run check"

  - name: "safe-markdown"
    type: "frontend-component"
    path: "web/src/shared/components/markdown"
    owner: "web/shared"
    purpose: "Reusable safe Markdown rendering boundary using markdown-it with raw HTML disabled and DOMPurify sanitization before v-html."
    use_when:
      - "Rendering user-authored Markdown content in module pages, drawers, dialogs, or read-only detail surfaces."
    do_not_use_when:
      - "Editing Markdown with a rich editor or rendering trusted static documentation outside Vue runtime."
    examples:
      - "web/src/shared/components/markdown/SafeMarkdown.vue"
    validation_commands:
      - "cd web && bun run check"

  - name: "route-bootstrap-utils"
    type: "frontend-utility"
    path: "web/src/utils/route"
    owner: "web/shell"
    purpose: "Bootstrap menu-to-route assembly, route title/meta helpers, and shell route constants."
    use_when:
      - "Consuming backend bootstrap menu metadata or adding shell route assembly behavior."
    do_not_use_when:
      - "Defining module-private page paths or module-owned bootstrap route declarations."
    examples:
      - "web/src/utils/route/bootstrap.ts"
      - "web/src/utils/route/title.ts"
    related_assets:
      - "route-menu-permission-contracts"
    validation_commands:
      - "cd web && bun run check"

  - name: "request-client"
    type: "frontend-utility"
    path: "web/src/utils/request.ts"
    owner: "web/shell"
    purpose: "Canonical Axios request adapter for auth headers, locale headers, envelope parsing, error normalization, and request logging."
    use_when:
      - "Adding or modifying frontend API access through module api wrappers."
    do_not_use_when:
      - "Adding another axios instance, generated runtime client, fetch wrapper, or module-private request transport."
    examples:
      - "web/src/modules/user/api/users.ts"
      - "web/src/modules/auth/api/auth.ts"
    related_assets:
      - "openapi-contracts"
      - "request-correlation-contract"
    validation_commands:
      - "cd web && bun run check"

  - name: "frontend-query-client"
    type: "frontend-utility"
    path: "web/src/shared/query"
    owner: "web/shared"
    purpose: "Application-wide TanStack Query client with bounded server-data cache defaults and session-bound cache clearing."
    use_when:
      - "Adding a module-owned query or mutation for server-owned HTTP data."
      - "Invalidating or updating cached server snapshots after a mutation or realtime event."
    do_not_use_when:
      - "Storing route query, form drafts, table presentation preferences, selection state, or editor buffers."
      - "Bypassing module API wrappers or the canonical Axios request client."
    examples:
      - "web/src/app/bootstrap/index.ts"
      - "web/src/modules/auth/store/session.ts"
    related_assets:
      - "request-client"
    validation_commands:
      - "cd web && bun run check"

  - name: "shared-css-color-parser"
    type: "frontend-utility"
    path: "web/src/shared/theme/css-color.ts"
    owner: "web/shared"
    purpose: "Reusable CSS color normalization and parsing for browser-resolved theme tokens, previews, and runtime consumers that need stable hex plus alpha channels."
    use_when:
      - "Converting browser-supported CSS colors or computed theme tokens into structured RGB/alpha data."
      - "Bridging modern CSS color syntax such as color() or slash-alpha rgb into consumers that require canonical hex output."
    do_not_use_when:
      - "The logic is module-private business presentation unrelated to shared theme or token color handling."
    examples:
      - "web/src/layouts/components/theme-workbench/theme-token-color.ts"
      - "web/src/modules/project/shared/project-monaco.ts"
    validation_commands:
      - "cd web && bun run check"

  - name: "brand-identity"
    type: "frontend-component"
    path: "web/src/shared/components/brand"
    owner: "web/shared"
    purpose: "Reusable brand mark and shell identity component for sidebar, header, and auth surfaces with token-driven currentColor theming."
    use_when:
      - "Rendering the shared Graft brand identity in shell-owned or auth-owned UI surfaces."
    do_not_use_when:
      - "The surface needs module-private business imagery or a non-brand status icon."
    examples:
      - "web/src/layouts/components/SideNav.vue"
      - "web/src/layouts/components/Header.vue"
      - "web/src/modules/auth/pages/components/Header.vue"
    validation_commands:
      - "cd web && bun run check"

  - name: "frontend-i18n-governance"
    type: "frontend-contract"
    path: "web/src/locales"
    owner: "web/shell"
    purpose: "Application locale state, root catalog, module catalog aggregation, fallback language, and i18n governance tests."
    use_when:
      - "Adding visible frontend copy, route titles, menu titles, or module locale catalogs."
    do_not_use_when:
      - "Duplicating module-owned locale keys into root catalog as a second truth."
    examples:
      - "web/src/locales/frontend-governance.test.ts"
      - "web/docs/frontend-i18n-guidelines.md"
    related_assets:
      - "openapi-contracts"
    validation_commands:
      - "cd web && bun run lint:i18n"
      - "cd web && bun run check"

  - name: "localized-api-error"
    type: "frontend-utility"
    path: "web/src/shared/localized-api-error.ts"
    owner: "web/shared"
    purpose: "Resolve API error messages through key-first i18n fallback semantics."
    use_when:
      - "Displaying backend envelope errors in pages, route guards, drawers, or shell interactions."
    do_not_use_when:
      - "Inventing local display mappings for backend error codes without checking the canonical message key."
    examples:
      - "web/src/modules/auth/pages/components/Login.vue"
      - "web/src/modules/notification/pages/list/index.vue"
      - "web/src/app/bootstrap/route-guards.ts"
    related_assets:
      - "frontend-i18n-governance"
      - "openapi-contracts"
    validation_commands:
      - "cd web && bun run check"

  - name: "realtime-topic-client"
    type: "frontend-utility"
    path: "web/src/shared/realtime"
    owner: "web/shared"
    purpose: "Ticket-first unified realtime topic subscription helper for opening canonical `/ws?topic=...&ticket=...` sockets without module-private WebSocket URL logic."
    use_when:
      - "Consuming canonical realtime topics from module pages or shared interactive surfaces."
      - "A page needs unified ticket issue plus WebSocket reconnection behavior without owning transport details."
    do_not_use_when:
      - "Building module-private shell or terminal session transports with their own dedicated contracts."
      - "Using HTTP polling as the authority for realtime resource snapshots."
    examples:
      - "web/src/modules/container/pages/list/index.vue"
      - "web/src/modules/container/pages/detail/index.vue"
      - "web/src/shared/realtime/ws-client.test.ts"
    related_assets:
      - "request-client"
      - "terminal-components"
      - "openapi-contracts"
    validation_commands:
      - "cd web && bun run check"
