referenced_tables:
- update_discovery_cache
operation_categories:
- additive-column
historical_data_assumptions:
- Previously executed discovery cache rows retain their latest_release_json projection.
- A null catalog_json keeps the existing latest-only fallback until the next verified
  release check.
planned_upgrade_order:
- Apply the forward-only nullable catalog column before starting a server that reads
  the complete release catalog.
- Existing server versions continue using the unchanged latest-release and timestamp
  fields.
safety_strategy:
  additive_only: Add one nullable JSONB column without rewriting existing snapshots
    or release identities.
  post_migration_invariant: The complete verified catalog can be loaded and saved
    while legacy latest-only snapshots remain readable.
  reconcile_or_abort: A manually modified incompatible schema fails migration and
    must be inspected before application startup.
validation_scenarios:
- Apply the migration to the original cache table containing an existing latest-only
  row and verify its data survives.
- Create a fresh cache schema and round-trip the full catalog and check timestamps
  through the repository.
preflight_checks:
- name: update-cache-owner-table-present
  query: SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = current_schema()
    AND table_name = 'update_discovery_cache'
  must_equal: 1
