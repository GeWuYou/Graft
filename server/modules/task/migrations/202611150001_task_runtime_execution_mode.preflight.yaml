migration:
  path: server/modules/task/migrations/202611150001_task_runtime_execution_mode.sql
  version: '202611150001'
owner: task
risk_level: L0
affected_tables:
- task_runtime_execution_mode
referenced_tables:
- tasks
- task_submissions
- task_external_execution_leases
operation_categories:
- additive-table
- singleton-initialization
historical_data_assumptions:
- Existing installations use Agent execution and retain their Task, submission and
  lease identities.
- The new table is initialized with Agent mode; an explicit local configuration may
  switch only after related work is settled.
planned_upgrade_order:
- Apply the additive Task-owned mode table before starting the new server.
- Run read-only mode preflight and let the exclusive Task Runtime recheck and bind
  the requested mode at startup.
safety_strategy:
  additive_only: Create one independent execution-mode row without rewriting existing
    Task, Stage, submission or lease facts.
  post_migration_invariant: Exactly one mode row exists, initially agent; execution
    owners serialize mode changes with unresolved related work preserved.
  reconcile_or_abort: A mode change with unsettled mode-bound Tasks, reserved Build
    submissions or claimed leases aborts before worker dispatch.
validation_scenarios:
- A legacy database starts in Agent mode and reads historical terminal Tasks.
- A fresh local install switches the seeded Agent row after a clean preflight.
- An unsettled local or Agent task prevents changing modes, while native mode-unbound
  Tasks remain valid.
- Concurrent stale submissions cannot reserve or materialize across the mode-binding
  transaction.
preflight_checks:
- name: task-execution-input-tables-present
  query: SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = current_schema()
    AND table_name IN ('tasks', 'task_submissions', 'task_external_execution_leases')
  must_equal: 3
retrieval_receipt:
