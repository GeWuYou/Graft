migration:
  path: server/modules/audit/migrations/202608190001_audit_deletion_idempotency.sql
  version: '202608190001'
owner: audit
risk_level: L4
affected_tables:
  - audit_logs
referenced_tables:
  - audit_logs
operation_categories:
  - duplicate-scan
  - partial-unique-index
historical_data_assumptions:
  - Existing audit deletion receipts may contain repeated non-empty auditDeletionIdempotencyKey values from concurrent requests.
  - Audit deletion receipts are protected audit facts and must not be deleted or rewritten automatically during migration.
planned_upgrade_order:
  - Scan every audit deletion receipt with a non-empty idempotency key and abort if duplicates exist.
  - Create the partial expression unique index only after the duplicate scan succeeds.
safety_strategy:
  duplicate_scan: Group all audit.logs.batch_deleted receipts by the exact auditDeletionIdempotencyKey expression used by the unique index.
  live_reference_scan: Inspect every protected deletion receipt covered by the index predicate; no external table reference or receipt mutation is permitted.
  reconcile_or_abort: Abort and require operator reconciliation when duplicate protected receipts exist; never choose or delete a receipt automatically.
  post_migration_invariant: At most one audit deletion receipt exists for each non-empty auditDeletionIdempotencyKey value.
  reference_impact: Existing audit deletion receipts remain unchanged; duplicate protected facts block the migration for explicit operator review.
  recovery_or_retirement_rationale: The migration neither retires nor rewrites audit evidence; operators reconcile the source incident before retrying the forward-only index creation.
validation_scenarios:
  - Duplicate protected deletion receipts cause the migration to abort before index creation.
  - Unique deletion receipts allow the partial expression unique index to be created.
  - Ordinary audit logs without an audit deletion idempotency key remain outside the index.
preflight_checks:
  - name: duplicate-audit-deletion-idempotency-receipts
    query: >-
      SELECT COUNT(*) FROM (SELECT metadata ->> 'auditDeletionIdempotencyKey' AS idempotency_key FROM audit_logs WHERE action = 'audit.logs.batch_deleted' AND metadata ->> 'auditDeletionIdempotencyKey' IS NOT NULL GROUP BY metadata ->> 'auditDeletionIdempotencyKey' HAVING COUNT(*) > 1) duplicates
    must_equal: 0
retrieval_receipt:
