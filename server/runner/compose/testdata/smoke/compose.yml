services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: graft
      POSTGRES_USER: graft
      POSTGRES_PASSWORD: graft
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graft -d graft"]
      interval: 2s
      timeout: 2s
      retries: 30
  bootstrap:
    image: graft-runner-fixture/graft-server:${GRAFT_IMAGE_TAG:?GRAFT_IMAGE_TAG is required}
    pull_policy: never
    entrypoint: ["/bin/true"]
    depends_on:
      postgres:
        condition: service_healthy
  server:
    image: graft-runner-fixture/graft-server:${GRAFT_IMAGE_TAG:?GRAFT_IMAGE_TAG is required}
    pull_policy: never
    volumes:
      - ${GRAFT_BACKUP_ARTIFACT_HOST_PATH}:${GRAFT_BACKUP_ARTIFACT_ROOT}
  web:
    image: graft-runner-fixture/graft-web:${GRAFT_IMAGE_TAG:?GRAFT_IMAGE_TAG is required}
    pull_policy: never
