name: Migration Governance

"on":
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-governance:
    name: Migration Governance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIGRATION_SCHEMA_REPORT: /tmp/graft-migration-schema-report.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: |
            server/go.mod
            server/go.sum
      - name: Build configuration validation CLI
        working-directory: server
        run: go build -o "${RUNNER_TEMP}/graft" ./cmd/graft
      - name: Validate official deployment configuration templates
        working-directory: server
        run: |
          "${RUNNER_TEMP}/graft" config validate --env-file ../compose.env.example --compose-file ../compose.yml
      - name: Test migration governance helpers
        run: python3 -m unittest scripts/test_check_migration_bootstrap.py
      - name: Validate SQL migration policy
        run: python3 scripts/validate_sql_migrations.py
      - name: Validate migration source
        shell: bash
        run: |
          set -euo pipefail
          cd server
          go run ./cmd/graft migrate validate
      - name: Resolve historical migration upgrade baseline
        shell: bash
        run: |
          set -euo pipefail
          upgrade_from=""
          while read -r candidate; do
            if git cat-file -e "${candidate}:server/internal/cli/migrate.go" 2>/dev/null \
              && git show "${candidate}:server/internal/cli/migrate.go" | grep -q -- 'allow-dirty'; then
              upgrade_from="${candidate}"
              break
            fi
          done < <(git tag --merged HEAD --sort=-version:refname | sed -n '/^v[0-9]/p')
          if [[ -n "${upgrade_from}" ]]; then
            git rev-parse --verify "${upgrade_from}^{commit}"
            echo "MIGRATION_UPGRADE_FROM=${upgrade_from}" >> "${GITHUB_ENV}"
          else
            echo "No compatible historical migration baseline found; skipping upgrade chain."
          fi
      - name: Bootstrap the empty PostgreSQL schema and check catalog contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_migration_bootstrap.py \
            --upgrade-from "${MIGRATION_UPGRADE_FROM}" \
            --schema-report "${MIGRATION_SCHEMA_REPORT}"
      - name: Upload migration governance diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: migration-governance-diagnostics
          path: |
            ${{ env.MIGRATION_SCHEMA_REPORT }}
          if-no-files-found: ignore
