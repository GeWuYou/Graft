name: Pull Request Validation

on:
  pull_request:
    branches: [main]
#    paths:
#      - ".github/workflows/**"
#      - "AGENTS.md"
#      - "README.md"
#      - "ai-plan/**"
#      - "server/**"
#      - "web/**"
  push:
    branches: [main]
#    paths:
#      - ".github/workflows/**"
#      - "AGENTS.md"
#      - "README.md"
#      - "ai-plan/**"
#      - "server/**"
#      - "web/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-push-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0

# Workflow jobs are execution-layer slices of repository validation truth.
# Acceptance criteria remain defined by root AGENTS.md and the repository entrypoints it names.

jobs:
  line-ending-check:
    name: LF Line Ending Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Enforce LF line endings
        run: python3 scripts/check_line_endings.py

      - name: Test line ending validator
        run: python3 -m unittest scripts/test_check_line_endings.py

  secret-scan:
    name: Secret Scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog OSS with exact synthetic fixture policy
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/scan_secrets.py --base "$SCAN_BASE" --head "$SCAN_HEAD"

  contract-governance-check:
    name: Contract Governance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Run contract governance check
        shell: bash
        run: |
          scanner="scripts/magic_value/check_magic_values.py"
          if [ ! -f "$scanner" ]; then
            echo "::notice title=Contract governance skipped::Missing $scanner; CI wiring is in place but the scanner has not been added on this branch."
            exit 0
          fi
          python3 "$scanner" --mode ci --output-json /tmp/contract-governance-ci.json

      - name: Upload contract governance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: contract-governance-ci
          path: /tmp/contract-governance-ci.json
          if-no-files-found: ignore

  contract-drift-report:
    name: Contract Drift Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Run contract drift report
        shell: bash
        run: |
          scanner="scripts/magic_value/check_magic_values.py"
          if [ ! -f "$scanner" ]; then
            echo "::notice title=Contract drift report skipped::Missing $scanner; report wiring is in place but the scanner has not been added on this branch."
            exit 0
          fi
          python3 "$scanner" --mode report --output-json /tmp/contract-governance-report.json

      - name: Upload contract drift report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: contract-governance-report
          path: /tmp/contract-governance-report.json
          if-no-files-found: ignore

  ai-governance-check:
    name: AI Governance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install AI governance dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Validate AI governance
        run: python3 scripts/validate_ai_governance.py

      - name: Run AI governance validator tests
        run: python3 -m unittest scripts/test_validate_ai_governance.py

      - name: Verify scoped validation and runtime artifact tooling
        run: python3 -m unittest scripts/test_local_validation.py scripts/test_governance_workflow.py scripts/test_ci_runtime_artifacts.py scripts/test_build_runtime_acceptance.py scripts/test_server_ctrf_report.py scripts/test_runtime_failure_diagnostics.py scripts/test_scan_secrets.py

      - name: Run repository skill-local tests
        run: python3 scripts/run_skill_tests.py

  web-check:
    name: Web Check
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Cache Bun package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Run unified web validation entrypoint
        working-directory: web
        run: bun run check


      - name: Package validated web runtime artifact
        run: python3 scripts/ci_runtime_artifacts.py prepare --kind web --directory .tmp/runtime-web

      - name: Upload validated web runtime artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-web
          path: .tmp/runtime-web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload web test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-test-results
          path: web/.tmp/test-results/ctrf-report.json
          if-no-files-found: ignore

      - name: Publish web test report
        if: always() && hashFiles('web/.tmp/test-results/ctrf-report.json') != ''
        uses: ctrf-io/github-test-reporter@dbb08957b5b2af918b39136ab2c5532002c7649b
        with:
          report-path: ./web/.tmp/test-results/ctrf-report.json
          github-report: true
          status-check: true
          status-check-name: Web Test Results
          pull-request: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          overwrite-comment: true
          always-latest-comment: true
          comment-tag: graft-web-tests
          summary-delta-report: true
          insights-report: true
          flaky-rate-report: true
          fail-rate-report: true
          slowest-report: true
          annotate: true
          upload-artifact: true
          fetch-previous-results: true
          exit-on-no-files: false
          exit-on-empty: false
          exit-on-fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cross-boundary-contract-freshness:
    name: Cross-Boundary Contract Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: |
            server/go.mod
            server/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Generate OpenAPI bundle
        run: node scripts/ensure-openapi-bundle.mjs

      # These existing checks form the canonical `just openapi-check` freshness chain.
      # They remain split here because this workflow does not install the Just runner.
      - name: Validate OpenAPI and backend generated artifacts
        working-directory: server
        run: go run ./cmd/graft validate openapi

      - name: Check web OpenAPI type freshness
        working-directory: web
        run: bun run openapi:types:check

      - name: Check OpenAPI runtime path projection freshness
        run: node scripts/openapi-runtime-paths.mjs --check

      - name: Check cross-boundary contract projection freshness
        working-directory: server
        run: go run ./internal/contract/projection/cmd/projectiongen --check

  openapi-breaking-check:
    name: OpenAPI Breaking Change Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: |
            server/go.mod
            server/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Run breaking-gate ledger tests
        run: node --test scripts/test-openapi-breaking.mjs

      # The script resolves the merge-base with origin/main itself; --base only overrides it.
      - name: Run OpenAPI breaking-change gate
        run: node scripts/openapi-breaking.mjs --base "$(git merge-base origin/main HEAD)"

  migration-bootstrap:
    name: Migration Governance
    uses: ./.github/workflows/migration-check.yml

  server-lint:
    name: Server Lint Stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: |
            server/go.mod
            server/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: server
          install-only: true

      - name: Resolve backend lint base branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_branch="${{ github.event.pull_request.base.ref }}"
          else
            base_branch="main"
          fi

          if [[ -z "${base_branch}" ]]; then
            echo "::error title=Backend lint gate base branch missing::Unable to resolve the base branch for server lint."
            exit 1
          fi

          if ! git fetch --no-tags --prune origin "${base_branch}"; then
            echo "::error title=Backend lint gate base fetch failed::Run 'git fetch origin ${base_branch}' and retry."
            exit 1
          fi

          base_ref="refs/remotes/origin/${base_branch}"
          base_source="remote-tracking ref"
          if ! git rev-parse --verify "${base_ref}" >/dev/null 2>&1; then
            if ! fetched_sha="$(git rev-parse --verify FETCH_HEAD 2>/dev/null)"; then
              echo "::error title=Backend lint gate base ref verify failed::Fetched ${base_branch} but neither ${base_ref} nor FETCH_HEAD is available in the current checkout."
              git rev-parse HEAD
              git branch -a
              exit 1
            fi

            base_ref="${fetched_sha}"
            base_source="FETCH_HEAD commit"
          fi

          echo "Resolved backend lint base ref ${base_ref} (${base_source}) for HEAD $(git rev-parse HEAD)"
          git branch -a --list "remotes/origin/${base_branch}"

          echo "GRAFT_LINT_BASE_REF=${base_ref}" >> "$GITHUB_ENV"

      - name: Run repository backend lint stage
        working-directory: server
        run: go run ./cmd/graft validate backend --stage lint

  server-lint-audit:
    name: Server Lint Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: |
            server/go.mod
            server/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: server
          install-only: true

      - name: Run full-repo backend lint audit
        working-directory: server
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          golangci-lint run --config .golangci.yml ./... | tee /tmp/server-golangci-lint-audit.txt

      - name: Upload backend lint audit artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: server-golangci-lint-audit
          path: /tmp/server-golangci-lint-audit.txt
          if-no-files-found: error

  server-build-test:
    name: Server Build/Test Stage
    permissions:
      checks: write
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    # Cold toolchain download can consume ten minutes before tests and versioned linking.
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: |
            server/go.mod
            server/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Generate OpenAPI bundle
        run: node scripts/ensure-openapi-bundle.mjs

      - name: Run repository backend build/test stage
        working-directory: server
        env:
          CGO_ENABLED: "1"
        run: go run ./cmd/graft validate backend --stage buildtest --test-report .tmp/test-results/server-go-test-ctrf.json


      - name: Test standard-library TLS release fixture
        run: go test tests/conformance/docker-runtime-agent/release-source.go tests/conformance/docker-runtime-agent/release-source_test.go

      - name: Test authenticated Registry fixture helper
        run: go -C server test -mod=readonly ../tests/conformance/docker-runtime-agent/registry-auth/main.go ../tests/conformance/docker-runtime-agent/registry-auth/main_test.go

      - name: Link versioned runtime acceptance binaries
        run: bash scripts/build_runtime_acceptance.sh

      - name: Package validated server runtime artifact
        run: |
          python3 scripts/ci_runtime_artifacts.py prepare --kind server --directory .tmp/runtime-server
          python3 scripts/ci_runtime_artifacts.py prepare --kind target-server --directory .tmp/runtime-target-server
          python3 scripts/ci_runtime_artifacts.py prepare --kind runner --directory .tmp/runtime-runner
          python3 scripts/ci_runtime_artifacts.py prepare --kind release-source --directory .tmp/runtime-release-source
          python3 scripts/ci_runtime_artifacts.py prepare --kind build-registry --directory .tmp/runtime-build-registry

      - name: Upload validated server runtime artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-server
          path: .tmp/runtime-server
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload validated target-server runtime artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-target-server
          path: .tmp/runtime-target-server
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload validated runner runtime artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-runner
          path: .tmp/runtime-runner
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload validated release-source runtime artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-release-source
          path: .tmp/runtime-release-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload validated build-registry runtime artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-build-registry
          path: .tmp/runtime-build-registry
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload server test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: server-test-results
          path: .tmp/test-results/server-go-test-ctrf.json
          if-no-files-found: ignore

      - name: Publish server test report
        if: always()
        uses: ctrf-io/github-test-reporter@dbb08957b5b2af918b39136ab2c5532002c7649b
        with:
          report-path: ./.tmp/test-results/server-go-test-ctrf.json
          github-report: true
          status-check: true
          status-check-name: Server Test Results
          pull-request: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          overwrite-comment: true
          always-latest-comment: true
          comment-tag: graft-server-tests
          summary-delta-report: true
          insights-report: true
          flaky-rate-report: true
          fail-rate-report: true
          slowest-report: true
          annotate: true
          upload-artifact: true
          fetch-previous-results: true
          exit-on-no-files: false
          exit-on-empty: false
          exit-on-fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  local-runtime-acceptance:
    name: Local runtime acceptance
    needs: [server-build-test, web-check]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GRAFT_CI_DIRECTORY: .local/docker-isolated/ci
      GRAFT_CI_PROJECT: graft-isolated-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact acceptance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download validated server binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-server
          path: .tmp/runtime-server

      - name: Download validated web distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-web
          path: .tmp/runtime-web

      - name: Download validated target-server runtime artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-target-server
          path: .tmp/runtime-target-server

      - name: Download validated runner runtime artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-runner
          path: .tmp/runtime-runner

      - name: Download validated release-source runtime artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-release-source
          path: .tmp/runtime-release-source

      - name: Download validated build-registry runtime artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-build-registry
          path: .tmp/runtime-build-registry

      - name: Verify runtime artifact source and bytes
        run: |
          python3 scripts/ci_runtime_artifacts.py verify --kind server --directory .tmp/runtime-server
          python3 scripts/ci_runtime_artifacts.py verify --kind web --directory .tmp/runtime-web
          python3 scripts/ci_runtime_artifacts.py verify --kind target-server --directory .tmp/runtime-target-server
          python3 scripts/ci_runtime_artifacts.py verify --kind runner --directory .tmp/runtime-runner
          python3 scripts/ci_runtime_artifacts.py verify --kind release-source --directory .tmp/runtime-release-source
          python3 scripts/ci_runtime_artifacts.py verify --kind build-registry --directory .tmp/runtime-build-registry

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build immutable runtime images from validated artifacts
        run: |
          source_revision="$(git rev-parse HEAD)"
          docker buildx build --load --platform linux/amd64 --label "org.opencontainers.image.revision=$source_revision" --build-context "release-binary=$PWD/.tmp/runtime-server" -f server/Dockerfile -t "graft-local-ci-server:$source_revision" server
          docker buildx build --load --platform linux/amd64 --label "org.opencontainers.image.revision=$source_revision" --build-context "release-binary=$PWD/.tmp/runtime-target-server" -f server/Dockerfile -t "graft-local-ci-target-server:$source_revision" server
          docker buildx build --load --platform linux/amd64 --label "org.opencontainers.image.revision=$source_revision" --build-context "build=$PWD/.tmp/runtime-runner" -f server/runner/compose/Dockerfile -t "graft-local-ci-runner:$source_revision" server
          docker buildx build --load --platform linux/amd64 --label "org.opencontainers.image.revision=$source_revision" --build-context "build=$PWD/.tmp/runtime-release-source" -f tests/conformance/docker-runtime-agent/Dockerfile.release-source -t "graft-local-ci-release-source:$source_revision" tests/conformance/docker-runtime-agent
          docker buildx build --load --platform linux/amd64 --label "org.opencontainers.image.revision=$source_revision" --build-context "build=$PWD/.tmp/runtime-build-registry" -f tests/conformance/docker-runtime-agent/Dockerfile.build-registry -t "graft-local-ci-build-registry:$source_revision" .
          cp -a .tmp/runtime-web/dist web/dist
          docker buildx build --load --platform linux/amd64 --label "org.opencontainers.image.revision=$source_revision" -f web/Dockerfile -t "graft-local-ci-web:$source_revision" web

      - name: Verify private-engine operations and frozen official installation
        run: |
          source_revision="$(git rev-parse HEAD)"
          python3 scripts/validate_docker_isolated.py init --execution-mode local --directory "$GRAFT_CI_DIRECTORY" --project "$GRAFT_CI_PROJECT" --source-revision "$source_revision" --backend-image "graft-local-ci-server:$source_revision" --target-backend-image "graft-local-ci-target-server:$source_revision" --web-image "graft-local-ci-web:$source_revision" --runner-image "graft-local-ci-runner:$source_revision" --release-fixture-image "graft-local-ci-release-source:$source_revision" --build-registry-image "graft-local-ci-build-registry:$source_revision" --port 28080
          python3 scripts/validate_docker_isolated.py up --directory "$GRAFT_CI_DIRECTORY"
          python3 scripts/validate_docker_isolated.py probe --directory "$GRAFT_CI_DIRECTORY"
          python3 scripts/validate_docker_isolated.py official-install --directory "$GRAFT_CI_DIRECTORY"
          python3 scripts/ci_runtime_artifacts.py acceptance --directory "$GRAFT_CI_DIRECTORY"
          python3 scripts/validate_docker_isolated.py build-api --directory "$GRAFT_CI_DIRECTORY"
          python3 scripts/ci_runtime_artifacts.py build-acceptance --directory "$GRAFT_CI_DIRECTORY"
          python3 scripts/validate_docker_isolated.py update-api --directory "$GRAFT_CI_DIRECTORY"
          python3 scripts/ci_runtime_artifacts.py update-acceptance --directory "$GRAFT_CI_DIRECTORY"

      - name: Collect sanitized failure diagnostics before cleanup
        if: failure()
        run: python3 scripts/ci_runtime_artifacts.py failure-diagnostics --directory "$GRAFT_CI_DIRECTORY"

      - name: Destroy only the registered acceptance project
        if: always()
        run: |
          if [ -f "$GRAFT_CI_DIRECTORY/instance.json" ]; then
            python3 scripts/validate_docker_isolated.py destroy --directory "$GRAFT_CI_DIRECTORY" --confirm-project "$GRAFT_CI_PROJECT"
          fi

      - name: Upload sanitized runtime acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-runtime-acceptance-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .local/docker-isolated/ci/api-evidence.json
            .local/docker-isolated/ci/source-assets.json
            .local/docker-isolated/ci/cleanup.json
            .local/docker-isolated/ci/failure-evidence.json
            .local/docker-isolated/ci/official/api-evidence.json
            .local/docker-isolated/ci/official/installation-evidence.json
            .tmp/runtime-server/provenance.json
            .tmp/runtime-web/provenance.json
            .tmp/runtime-target-server/provenance.json
            .tmp/runtime-runner/provenance.json
            .tmp/runtime-release-source/provenance.json
            .local/docker-isolated/ci/release-api/update-api-evidence.json
            .tmp/runtime-build-registry/provenance.json
            .local/docker-isolated/ci/build-api/build-api-evidence.json

  required-checks:
    name: Required checks passed
    if: always()
    needs: [line-ending-check, secret-scan, contract-governance-check, ai-governance-check, web-check, cross-boundary-contract-freshness, openapi-breaking-check, migration-bootstrap, server-lint, server-build-test, local-runtime-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize independent required results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["NEEDS_JSON"])
          failed = []
          for name, value in results.items():
              result = value["result"]
              allowed = result == "success" or (name == "secret-scan" and result == "skipped" and os.environ["EVENT_NAME"] == "push")
              print(f"{name}: {result}")
              if not allowed:
                  failed.append(name)
          if failed:
              raise SystemExit("Required checks failed: " + ", ".join(failed))
          PY
