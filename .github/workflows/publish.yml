name: Publish Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  packages: write

jobs:
  backend-release-validation:
    name: Backend Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13

      - name: Install web dependencies for OpenAPI generation
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Generate OpenAPI bundle
        run: node scripts/ensure-openapi-bundle.mjs

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.12.2
          working-directory: server
          install-only: true

      - name: Resolve backend release validation base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git rev-parse --verify 'refs/remotes/origin/main^{commit}'

          base_ref="refs/remotes/origin/main"
          if git merge-base --is-ancestor HEAD "${base_ref}"; then
            base_ref="$(git rev-parse HEAD^)"
          fi

          echo "GRAFT_LINT_BASE_REF=${base_ref}" >> "${GITHUB_ENV}"

      - name: Run backend release validation
        working-directory: server
        run: go run ./cmd/graft validate backend

  web-release-validation:
    name: Web Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13

      - name: Cache Bun package downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run web release validation
        working-directory: web
        run: bun run check

      - name: Package validated web distribution
        working-directory: web
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          mkdir -p ../release-web-asset
          tar -czf "../release-web-asset/graft-web-dist-${RELEASE_REF_NAME}.tar.gz" dist

      - name: Upload validated web distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-web-asset
          path: release-web-asset/*
          retention-days: 1
          if-no-files-found: error

  build-artifacts:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs:
      - backend-release-validation
      - web-release-validation

    permissions:
      contents: read

    outputs:
      version: ${{ steps.tag_version.outputs.version }}
      channel: ${{ steps.tag_version.outputs.channel }}
      is_prerelease: ${{ steps.tag_version.outputs.is_prerelease }}

    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Determine tag version
        id: tag_version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            channel="stable"
            is_prerelease="false"
          elif [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.([1-9][0-9]*)$ ]]; then
            channel="beta"
            is_prerelease="true"
          else
            echo "::error::Unsupported release tag '${tag}'. Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.N (N >= 1)."
            exit 1
          fi

          version="${tag#v}"
          echo "tag=${tag}"
          echo "version=${version}"
          echo "channel=${channel}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease=${is_prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download validated web distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-web-asset
          path: release-assets

      - name: Build server binary
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p ../dist/server
          build_time_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X 'graft/server/internal/buildinfo.version=${{ steps.tag_version.outputs.version }}' \
              -X 'graft/server/internal/buildinfo.gitCommit=${GITHUB_SHA}' \
              -X 'graft/server/internal/buildinfo.buildTimeUTC=${build_time_utc}' \
              -X 'graft/server/internal/buildinfo.gitTreeState=clean'" \
            -o ../dist/server/graft-server-linux-amd64 \
            ./cmd/graft

      - name: Validate release binary contract
        run: |
          set -euo pipefail
          ./dist/server/graft-server-linux-amd64 validate release

      - name: Package release artifacts
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          tar -C dist/server -czf "release-assets/graft-server-linux-amd64-${RELEASE_REF_NAME}.tar.gz" graft-server-linux-amd64
          cp LICENSE "release-assets/graft-license-${RELEASE_REF_NAME}.txt"
          sha256sum release-assets/* > "release-assets/graft-sha256sums-${RELEASE_REF_NAME}.txt"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  publish-images:
    name: Smoke and Publish Container Images
    runs-on: ubuntu-latest
    needs:
      - build-artifacts
      - bubble-smoke

    permissions:
      contents: read
      packages: write

    outputs:
      owner_lc: ${{ steps.image_vars.outputs.owner_lc }}
      server_image: ${{ steps.image_vars.outputs.server_image }}
      web_image: ${{ steps.image_vars.outputs.web_image }}
      runner_image: ${{ steps.image_vars.outputs.runner_image }}
      agent_image: ${{ steps.image_vars.outputs.agent_image }}
      channel: ${{ needs.build-artifacts.outputs.channel }}
      server_digest: ${{ steps.publish_release_images.outputs.server_digest }}
      web_digest: ${{ steps.publish_release_images.outputs.web_digest }}
      runner_digest: ${{ steps.publish_release_images.outputs.runner_digest }}
      agent_digest: ${{ steps.publish_release_images.outputs.agent_digest }}
      runner_reused: ${{ steps.runner_reuse.outputs.reuse }}
      agent_reused: ${{ steps.agent_reuse.outputs.reuse }}

    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare image coordinates
        id: image_vars
        shell: bash
        run: |
          set -euo pipefail
          owner_lc="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          server_image="ghcr.io/${owner_lc}/graft-server"
          web_image="ghcr.io/${owner_lc}/graft-web"
          runner_image="ghcr.io/${owner_lc}/graft-compose-runner"
          agent_image="ghcr.io/${owner_lc}/graft-docker-runtime-agent"
          echo "owner_lc=${owner_lc}" >> "${GITHUB_OUTPUT}"
          echo "server_image=${server_image}" >> "${GITHUB_OUTPUT}"
          echo "web_image=${web_image}" >> "${GITHUB_OUTPUT}"
          echo "runner_image=${runner_image}" >> "${GITHUB_OUTPUT}"
          echo "agent_image=${agent_image}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Setup Go for Runner and Agent input discovery
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: release-assets

      - name: Restore web dist artifact
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf web/dist
          tar -C web -xzf "release-assets/graft-web-dist-${RELEASE_REF_NAME}.tar.gz"

      - name: Restore server binary artifact
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/server
          tar -C dist/server -xzf "release-assets/graft-server-linux-amd64-${RELEASE_REF_NAME}.tar.gz"
          chmod +x dist/server/graft-server-linux-amd64

      - name: Log in to GHCR for Runner reuse inspection
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve reusable Compose Runner manifest
        id: runner_reuse
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.build-artifacts.outputs.channel }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RUNNER_IMAGE: ${{ steps.image_vars.outputs.runner_image }}
        shell: bash
        run: |
          set -euo pipefail

          inspect_digest() {
            docker buildx imagetools inspect "$1" | awk '
              /^Digest:/ { print $2; found = 1; exit }
              END { if (!found) exit 1 }
            '
          }
          mkdir -p .tmp/runner-reuse
          releases_json=".tmp/runner-reuse/releases.json"
          candidates_json=".tmp/runner-reuse/candidates.json"

          # A GitHub API failure is not equivalent to "first release": fail closed
          # instead of rebuilding or reusing without a trustworthy release catalog.
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "${releases_json}"
          python3 scripts/resolve_runner_release_reuse.py \
            --channel "${RELEASE_CHANNEL}" \
            --runner-image "${RUNNER_IMAGE}" \
            --current-tag "${RELEASE_REF_NAME}" \
            < "${releases_json}" > "${candidates_json}"

          mapfile -t runner_inputs < <(
            cd server
            go list -deps -f '{{if and (not .Standard) (eq .Module.Path "graft/server")}}{{.Dir}}{{end}}' ./cmd/graft-compose-runner \
              | sed "s#^${GITHUB_WORKSPACE}/##" \
              | sort -u
          )
          runner_inputs+=(
            server/runner/compose/Dockerfile
            server/.dockerignore
            server/go.mod
            server/go.sum
          )

          reuse="false"
          source_tag=""
          source_digest=""
          reason="no verified historical Runner manifest"
          while IFS= read -r candidate; do
            candidate_tag="$(jq -er '.tag' <<< "${candidate}")"
            candidate_digest="$(jq -er '.digest' <<< "${candidate}")"
            candidate_ref="${RUNNER_IMAGE}@${candidate_digest}"

            raw_manifest="$(docker buildx imagetools inspect --raw "${candidate_ref}")" || continue
            jq -e '
              (.schemaVersion == 2)
              and (.mediaType == "application/vnd.docker.distribution.manifest.v2+json" or .mediaType == "application/vnd.oci.image.manifest.v1+json")
              and (.config.digest | test("^sha256:[0-9a-f]{64}$"))
              and (.layers | type == "array" and length > 0)
              and (has("manifests") | not)
            ' <<< "${raw_manifest}" >/dev/null || continue

            resolved_digest="$(inspect_digest "${candidate_ref}")" || continue
            [[ "${resolved_digest}" == "${candidate_digest}" ]] || continue
            platform="$(docker buildx imagetools inspect --format '{{.Image.OS}}/{{.Image.Architecture}}' "${candidate_ref}")" || continue
            [[ "${platform}" == "linux/amd64" ]] || continue

            if git diff --quiet "${candidate_tag}" "${GITHUB_SHA}" -- "${runner_inputs[@]}"; then
              reuse="true"
              source_tag="${candidate_tag}"
              source_digest="${candidate_digest}"
              reason="Runner inputs unchanged since ${candidate_tag}"
              break
            fi
          done < <(jq -c '.candidates[]?' "${candidates_json}")

          {
            echo "reuse=${reuse}"
            echo "source_tag=${source_tag}"
            echo "source_digest=${source_digest}"
            echo "reason=${reason}"
          } >> "${GITHUB_OUTPUT}"
          echo "Runner reuse: ${reuse} (${reason})"

      - name: Resolve reusable Docker Runtime Agent image
        id: agent_reuse
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.build-artifacts.outputs.channel }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          AGENT_IMAGE: ${{ steps.image_vars.outputs.agent_image }}
        shell: bash
        run: |
          set -euo pipefail

          inspect_digest() {
            docker buildx imagetools inspect "$1" | awk '
              /^Digest:/ { print $2; found = 1; exit }
              END { if (!found) exit 1 }
            '
          }

          mkdir -p .tmp/agent-reuse
          agent_inputs_file=".tmp/agent-reuse/inputs.txt"
          releases_json=".tmp/agent-reuse/releases.json"
          candidates_json=".tmp/agent-reuse/candidates.json"

          # A GitHub API failure is not equivalent to "first release": fail closed
          # instead of reusing without a trustworthy release catalog.
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "${releases_json}"
          python3 scripts/resolve_runner_release_reuse.py \
            --channel "${RELEASE_CHANNEL}" \
            --agent-image "${AGENT_IMAGE}" \
            --current-tag "${RELEASE_REF_NAME}" \
            < "${releases_json}" > "${candidates_json}"

          (
            cd server
            go list -deps -f '{{if and (not .Standard) (eq .Module.Path "graft/server")}}{{.Dir}}{{end}}' ./agents/docker-runtime-agent/cmd
          ) | sed "s#^${GITHUB_WORKSPACE}/##" | sort -u > "${agent_inputs_file}"
          [[ -s "${agent_inputs_file}" ]] || {
            echo "::error::Failed to resolve Docker Runtime Agent build inputs."
            exit 1
          }
          mapfile -t agent_inputs < "${agent_inputs_file}"
          agent_inputs+=(
            server/agents/docker-runtime-agent/Dockerfile
            server/.dockerignore
            server/go.mod
            server/go.sum
          )

          reuse="false"
          source_tag=""
          source_digest=""
          reason="no verified historical Docker Runtime Agent manifest"
          while IFS= read -r candidate; do
            candidate_tag="$(jq -er '.tag' <<< "${candidate}")"
            candidate_digest="$(jq -er '.digest' <<< "${candidate}")"
            raw_manifest="$(docker buildx imagetools inspect --raw "${AGENT_IMAGE}@${candidate_digest}")" || continue
            jq -e '
              (.schemaVersion == 2)
              and (.mediaType == "application/vnd.docker.distribution.manifest.v2+json" or .mediaType == "application/vnd.oci.image.manifest.v1+json")
              and (.config.digest | test("^sha256:[0-9a-f]{64}$"))
              and (.layers | type == "array" and length > 0)
              and (has("manifests") | not)
            ' <<< "${raw_manifest}" >/dev/null || continue
            platform="$(docker buildx imagetools inspect --format '{{.Image.OS}}/{{.Image.Architecture}}' "${AGENT_IMAGE}@${candidate_digest}")" || continue
            [[ "${platform}" == "linux/amd64" ]] || continue
            if git diff --quiet "${candidate_tag}" "${GITHUB_SHA}" -- "${agent_inputs[@]}"; then
              reuse="true"
              source_tag="${candidate_tag}"
              source_digest="${candidate_digest}"
              reason="Docker Runtime Agent inputs unchanged since ${candidate_tag}"
              break
            fi
          done < <(jq -c '.candidates[]?' "${candidates_json}")

          echo "reuse=${reuse}" >> "${GITHUB_OUTPUT}"
          echo "source_tag=${source_tag}" >> "${GITHUB_OUTPUT}"
          echo "source_digest=${source_digest}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          echo "Docker Runtime Agent reuse: ${reuse} (${reason})"

      - name: Prepare Docker metadata tags
        id: image_tags
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.build-artifacts.outputs.channel }}
          RELEASE_VERSION: ${{ needs.build-artifacts.outputs.version }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${RELEASE_CHANNEL}" in
            stable)
              tag_lines="$(cat <<EOF
          type=raw,value=${RELEASE_VERSION}
          type=raw,value=${RELEASE_REF_NAME}
          EOF
          )"
              ;;
            beta)
              tag_lines="$(cat <<EOF
          type=raw,value=${RELEASE_REF_NAME}
          EOF
          )"
              ;;
            *)
              echo "::error::Unsupported release channel '${RELEASE_CHANNEL}'."
              exit 1
              ;;
          esac

          {
            echo "tags<<EOF"
            printf '%s\n' "${tag_lines}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Docker metadata for server image
        id: server_meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.image_vars.outputs.server_image }}
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Graft Server
            org.opencontainers.image.description=Graft backend runtime image

      - name: Docker metadata for web image
        id: web_meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.image_vars.outputs.web_image }}
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Graft Web
            org.opencontainers.image.description=Graft frontend static site image

      - name: Docker metadata for Compose runner image
        id: runner_meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.image_vars.outputs.runner_image }}
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Graft Compose Update Runner
            org.opencontainers.image.description=One-shot Graft Compose update runner

      - name: Docker metadata for Docker Runtime Agent image
        id: agent_meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.image_vars.outputs.agent_image }}
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Graft Docker Runtime Agent
            org.opencontainers.image.description=Independent Graft Docker Runtime Agent

      - name: Build and push server image
        id: server_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./server
          file: ./server/Dockerfile
          build-contexts: |
            release-binary=./dist/server
          platforms: linux/amd64
          load: true
          push: false
          tags: graft-release-server:${{ github.run_id }}
          labels: ${{ steps.server_meta.outputs.labels }}
          cache-from: type=gha,scope=graft-server-image
          cache-to: type=gha,mode=max,scope=graft-server-image

      - name: Build web image for smoke
        id: web_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: graft-release-web:${{ github.run_id }}
          labels: ${{ steps.web_meta.outputs.labels }}
          cache-from: type=gha,scope=graft-web-image
          cache-to: type=gha,mode=max,scope=graft-web-image

      - name: Build Compose runner image for smoke
        if: steps.runner_reuse.outputs.reuse != 'true'
        id: runner_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./server
          file: ./server/runner/compose/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: graft-release-runner:${{ github.run_id }}
          labels: ${{ steps.runner_meta.outputs.labels }}
          cache-from: type=gha,scope=graft-compose-runner-image
          cache-to: type=gha,mode=max,scope=graft-compose-runner-image

      - name: Build Docker Runtime Agent image
        if: steps.agent_reuse.outputs.reuse != 'true'
        id: agent_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./server
          file: ./server/agents/docker-runtime-agent/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: graft-release-docker-runtime-agent:${{ github.run_id }}
          labels: ${{ steps.agent_meta.outputs.labels }}
          cache-from: type=gha,scope=graft-docker-runtime-agent-image
          cache-to: type=gha,mode=max,scope=graft-docker-runtime-agent-image

      - name: Run Compose smoke against local images
        env:
          GRAFT_RELEASE_SERVER_IMAGE: graft-release-server
          GRAFT_RELEASE_WEB_IMAGE: graft-release-web
          GRAFT_RELEASE_IMAGE_TAG: ${{ github.run_id }}
          GRAFT_RELEASE_SMOKE_LOG_DIR: .tmp/release-compose-smoke
        run: ./scripts/smoke_release_compose.sh

      - name: Upload Compose smoke logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-compose-smoke-logs
          path: .tmp/release-compose-smoke/*
          if-no-files-found: ignore

      - name: Log in to GHCR after smoke gates
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish approved image tags
        id: publish_release_images
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          SERVER_IMAGE: ${{ steps.image_vars.outputs.server_image }}
          WEB_IMAGE: ${{ steps.image_vars.outputs.web_image }}
          RUNNER_IMAGE: ${{ steps.image_vars.outputs.runner_image }}
          AGENT_IMAGE: ${{ steps.image_vars.outputs.agent_image }}
          SERVER_TAGS: ${{ steps.server_meta.outputs.tags }}
          WEB_TAGS: ${{ steps.web_meta.outputs.tags }}
          RUNNER_TAGS: ${{ steps.runner_meta.outputs.tags }}
          AGENT_TAGS: ${{ steps.agent_meta.outputs.tags }}
          RUNNER_REUSE: ${{ steps.runner_reuse.outputs.reuse }}
          RUNNER_REUSE_DIGEST: ${{ steps.runner_reuse.outputs.source_digest }}
          AGENT_REUSE: ${{ steps.agent_reuse.outputs.reuse }}
          AGENT_REUSE_DIGEST: ${{ steps.agent_reuse.outputs.source_digest }}
        shell: bash
        run: |
          set -euo pipefail

          publish_local_image() {
            local source="$1"
            local tags="$2"
            while IFS= read -r tag; do
              [[ -n "${tag}" ]] || continue
              docker tag "${source}" "${tag}"
              docker push "${tag}"
            done <<< "${tags}"
          }

          inspect_digest() {
            docker buildx imagetools inspect "$1" | awk '
              /^Digest:/ { print $2; found = 1; exit }
              END { if (!found) exit 1 }
            '
          }

          publish_local_image "graft-release-server:${{ github.run_id }}" "${SERVER_TAGS}"
          publish_local_image "graft-release-web:${{ github.run_id }}" "${WEB_TAGS}"
          if [[ "${RUNNER_REUSE}" == "true" ]]; then
            runner_digest="$(inspect_digest "${RUNNER_IMAGE}@${RUNNER_REUSE_DIGEST}")"
            [[ "${runner_digest}" == "${RUNNER_REUSE_DIGEST}" ]]
          else
            publish_local_image "graft-release-runner:${{ github.run_id }}" "${RUNNER_TAGS}"
            runner_digest="$(inspect_digest "${RUNNER_IMAGE}:${RELEASE_REF_NAME}")"
          fi
          if [[ "${AGENT_REUSE}" == "true" ]]; then
            agent_digest="$(inspect_digest "${AGENT_IMAGE}@${AGENT_REUSE_DIGEST}")"
            [[ "${agent_digest}" == "${AGENT_REUSE_DIGEST}" ]]
          else
            publish_local_image "graft-release-docker-runtime-agent:${{ github.run_id }}" "${AGENT_TAGS}"
            agent_digest="$(inspect_digest "${AGENT_IMAGE}:${RELEASE_REF_NAME}")"
          fi

          server_digest="$(inspect_digest "${SERVER_IMAGE}:${RELEASE_REF_NAME}")"
          web_digest="$(inspect_digest "${WEB_IMAGE}:${RELEASE_REF_NAME}")"
          [[ "${server_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${web_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${runner_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${agent_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "server_digest=${server_digest}" >> "${GITHUB_OUTPUT}"
          echo "web_digest=${web_digest}" >> "${GITHUB_OUTPUT}"
          echo "runner_digest=${runner_digest}" >> "${GITHUB_OUTPUT}"
          echo "agent_digest=${agent_digest}" >> "${GITHUB_OUTPUT}"

      - name: Write image manifest
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build-artifacts.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.build-artifacts.outputs.channel }}
          SERVER_IMAGE: ${{ steps.image_vars.outputs.server_image }}
          SERVER_DIGEST: ${{ steps.publish_release_images.outputs.server_digest }}
          WEB_IMAGE: ${{ steps.image_vars.outputs.web_image }}
          WEB_DIGEST: ${{ steps.publish_release_images.outputs.web_digest }}
          RUNNER_IMAGE: ${{ steps.image_vars.outputs.runner_image }}
          RUNNER_DIGEST: ${{ steps.publish_release_images.outputs.runner_digest }}
          AGENT_IMAGE: ${{ steps.image_vars.outputs.agent_image }}
          AGENT_DIGEST: ${{ steps.publish_release_images.outputs.agent_digest }}
        run: |
          set -euo pipefail
          mkdir -p image-assets
          cat > "image-assets/graft-container-images-${RELEASE_REF_NAME}.txt" <<EOF
          server_image=${SERVER_IMAGE}
          server_tag=${RELEASE_REF_NAME}
          server_digest=${SERVER_DIGEST}
          web_image=${WEB_IMAGE}
          web_tag=${RELEASE_REF_NAME}
          web_digest=${WEB_DIGEST}
          runner_image=${RUNNER_IMAGE}
          runner_digest=${RUNNER_DIGEST}
          docker_runtime_agent_image=${AGENT_IMAGE}
          docker_runtime_agent_digest=${AGENT_DIGEST}
          EOF

          # This is the machine-readable release authority consumed by self-update.
          # Migration execution is always explicit and idempotent; the manifest does
          # not attempt to infer whether a particular release contains SQL changes.
          server_asset="graft-server-linux-amd64-${RELEASE_REF_NAME}.tar.gz"
          web_asset="graft-web-dist-${RELEASE_REF_NAME}.tar.gz"
          checksums_asset="graft-sha256sums-${RELEASE_REF_NAME}.txt"
          server_asset_sha256="$(sha256sum "release-assets/${server_asset}" | awk '{print $1}')"
          web_asset_sha256="$(sha256sum "release-assets/${web_asset}" | awk '{print $1}')"
          jq -n \
            --arg version "${RELEASE_VERSION}" \
            --arg channel "${RELEASE_CHANNEL}" \
            --arg releaseTag "${RELEASE_REF_NAME}" \
            --arg releaseNotesURL "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_REF_NAME}" \
            --arg upgradeNotes "Review the GitHub Release Notes and perform the manifest-declared migration before runtime startup." \
            --arg serverImage "${SERVER_IMAGE}" \
            --arg serverDigest "${SERVER_DIGEST}" \
            --arg webImage "${WEB_IMAGE}" \
            --arg webDigest "${WEB_DIGEST}" \
            --arg runnerImage "${RUNNER_IMAGE}" \
            --arg runnerDigest "${RUNNER_DIGEST}" \
            --arg agentImage "${AGENT_IMAGE}" \
            --arg agentDigest "${AGENT_DIGEST}" \
            --arg serverArtifact "${server_asset}" \
            --arg webArtifact "${web_asset}" \
            --arg checksums "${checksums_asset}" \
            --arg serverAssetSHA256 "${server_asset_sha256}" \
            --arg webAssetSHA256 "${web_asset_sha256}" \
            '{
              schema_version: 1,
              version: $version,
              channel: $channel,
              release_tag: $releaseTag,
              release_notes_url: $releaseNotesURL,
              upgrade_notes: $upgradeNotes,
              images: {
                server: {
                  image: $serverImage,
                  digest: $serverDigest,
                  reference: ($serverImage + "@" + $serverDigest)
                },
                web: {
                  image: $webImage,
                  digest: $webDigest,
                  reference: ($webImage + "@" + $webDigest)
                }
              },
              runners: {
                compose: {
                  image: $runnerImage,
                  digest: $runnerDigest,
                  reference: ($runnerImage + "@" + $runnerDigest)
                }
              },
              agents: {
                docker_runtime_agent: {
                  image: $agentImage,
                  digest: $agentDigest,
                  reference: ($agentImage + "@" + $agentDigest)
                }
              },
              artifacts: {
                server: $serverArtifact,
                web: $webArtifact,
                checksums: $checksums,
                sha256: {($serverArtifact): $serverAssetSHA256, ($webArtifact): $webAssetSHA256}
              },
              migration: {
                required_before_runtime: true,
                command: "graft migrate up",
                mode: "forward-only"
              }
            }' > "image-assets/release-manifest.json"

          jq -e '
            .schema_version == 1
            and (.version | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-beta\\.[1-9][0-9]*)?$"))
            and (.channel == "stable" or .channel == "beta")
            and (.release_tag == ("v" + .version))
            and (.release_notes_url | startswith("https://github.com/"))
            and (.upgrade_notes | length > 0)
            and (.artifacts.sha256[.artifacts.server] | test("^[0-9a-f]{64}$"))
            and (.artifacts.sha256[.artifacts.web] | test("^[0-9a-f]{64}$"))
            and (.images.server.digest | startswith("sha256:"))
            and (.images.web.digest | startswith("sha256:"))
            and (.runners.compose.image | startswith("ghcr.io/"))
            and (.runners.compose.digest | startswith("sha256:"))
            and (.runners.compose.reference == (.runners.compose.image + "@" + .runners.compose.digest))
            and (.agents.docker_runtime_agent.image | startswith("ghcr.io/"))
            and (.agents.docker_runtime_agent.digest | test("^sha256:[0-9a-f]{64}$"))
            and (.agents.docker_runtime_agent.reference == (.agents.docker_runtime_agent.image + "@" + .agents.docker_runtime_agent.digest))
            and (.migration.required_before_runtime == true)
          ' "image-assets/release-manifest.json" >/dev/null
          sha256sum "image-assets/release-manifest.json" > "image-assets/release-manifest.json.sha256"

      - name: Upload image manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-assets
          path: image-assets/*
          if-no-files-found: error

  bubble-smoke:
    name: Bubble Smoke Gate
    runs-on: ubuntu-latest
    needs: build-artifacts
    timeout-minutes: 15

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: graft
          POSTGRES_USER: graft
          POSTGRES_PASSWORD: graft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graft -d graft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      GRAFT_APP_ENV: ci
      GRAFT_CONFIG_SCHEMA_VERSION: "1"
      GRAFT_HTTP_ADDR: 127.0.0.1:18080
      GRAFT_DATABASE_URL: postgres://graft:graft@127.0.0.1:5432/graft?sslmode=disable
      GRAFT_REDIS_ADDR: 127.0.0.1:6379
      GRAFT_AUTH_JWT_SECRET: ci-release-smoke-secret
      GRAFT_LOG_FORMAT: json
      GRAFT_LOG_COLOR: never
      GRAFT_ACCESS_LOG_CONSOLE: error_only
      GRAFT_OPS_CONTAINER_RUNTIME_ENABLED: "false"
      GRAFT_OPS_CONTAINER_SHELL_ENABLED: "false"

    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: release-assets

      - name: Extract release binary
        run: |
          set -euo pipefail
          mkdir -p smoke-bin
          tar -C smoke-bin -xzf "release-assets/graft-server-linux-amd64-${GITHUB_REF_NAME}.tar.gz"
          chmod +x smoke-bin/graft-server-linux-amd64

      - name: Run release bubble smoke
        id: bubble_smoke
        shell: bash
        run: |
          set -euo pipefail
          start_epoch="$(date +%s)"
          probe_url="http://${GRAFT_HTTP_ADDR}/healthz"
          echo "probe_url=${probe_url}" >> "${GITHUB_OUTPUT}"

          mkdir -p .tmp
          ./smoke-bin/graft-server-linux-amd64 migrate up --allow-dirty 2>&1 | tee .tmp/release-bubble-migrate.log

          server_pid=""
          cleanup() {
            if [[ -n "${server_pid}" ]] && kill -0 "${server_pid}" >/dev/null 2>&1; then
              kill "${server_pid}" >/dev/null 2>&1 || true
              wait "${server_pid}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          ./smoke-bin/graft-server-linux-amd64 serve > .tmp/release-bubble-server.log 2>&1 &
          server_pid=$!

          set +e
          smoke_status=1
          for _ in $(seq 1 30); do
            if curl -fsS "${probe_url}" > .tmp/release-bubble-healthz.json; then
              smoke_status=0
              break
            fi
            if ! kill -0 "${server_pid}" >/dev/null 2>&1; then
              smoke_status=1
              break
            fi
            sleep 1
          done
          end_epoch="$(date +%s)"
          duration="$((end_epoch - start_epoch))"
          echo "duration_seconds=${duration}" >> "${GITHUB_OUTPUT}"
          if [[ ${smoke_status} -ne 0 ]]; then
            echo "result=failed" >> "${GITHUB_OUTPUT}"
            cat .tmp/release-bubble-server.log
            exit "${smoke_status}"
          fi
          cat .tmp/release-bubble-healthz.json | tee .tmp/release-bubble-smoke.log
          set -e
          echo "result=passed" >> "${GITHUB_OUTPUT}"

      - name: Upload bubble smoke logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-bubble-smoke-logs
          path: |
            .tmp/release-bubble-migrate.log
            .tmp/release-bubble-server.log
            .tmp/release-bubble-healthz.json
            .tmp/release-bubble-smoke.log
          if-no-files-found: ignore

      - name: Write bubble smoke summary
        if: always()
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "## Bubble Smoke Gate"
            echo
            echo "- Tag: \`${RELEASE_REF_NAME}\`"
            echo "- Version: \`${{ needs.build-artifacts.outputs.version }}\`"
            echo "- Probe URL: \`${{ steps.bubble_smoke.outputs.probe_url || 'http://127.0.0.1:18080/healthz' }}\`"
            echo "- Result: \`${{ steps.bubble_smoke.outputs.result || 'failed' }}\`"
            echo "- Duration Seconds: \`${{ steps.bubble_smoke.outputs.duration_seconds || 'unknown' }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-artifacts
      - bubble-smoke
      - publish-images

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release PAT
        uses: ./.github/actions/validate-pat
        with:
          pat-token: ${{ secrets.PAT_TOKEN }}
          repo-api-url: ${{ github.api_url }}/repos/${{ github.repository }}
          repository: ${{ github.repository }}
          missing-token-message: PAT_TOKEN is required to dispatch the post-release SBOM and license compliance workflow.
          workflow-dispatch-probe: license-compliance.yml
          workflow-dispatch-required-message: PAT_TOKEN must allow workflow dispatch for license-compliance.yml; use a classic token with workflow scope or a fine-grained token with Actions read/write permission.

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: release-assets

      - name: Download image manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: image-assets
          path: release-assets

      - name: Generate release notes
        id: cliff_release
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5
        with:
          config: .github/cliff.toml
          args: >-
            -vv --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ needs.build-artifacts.outputs.is_prerelease == 'true' }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Dispatch release SBOM workflow
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          gh workflow run license-compliance.yml \
            --ref "${RELEASE_TAG}" \
            -f "release_tag=${RELEASE_TAG}"

          {
            echo "## Release SBOM Dispatch"
            echo
            echo "- Workflow: \`license-compliance.yml\`"
            echo "- Trigger: \`workflow_dispatch\` via \`PAT_TOKEN\`"
            echo "- Release Tag: \`${RELEASE_TAG}\`"
            echo "- Reason: GitHub Release creation in this workflow uses \`github.token\`, which does not fan out a second workflow run through \`release.published\`."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Write publish summary
        env:
          CLIFF_RELEASE_NOTES: ${{ steps.cliff_release.outputs.content }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "## GitHub Release"
            echo
            echo "- Tag: \`${RELEASE_REF_NAME}\`"
            echo "- Version: \`${{ needs.build-artifacts.outputs.version }}\`"
            echo "- Channel: \`${{ needs.build-artifacts.outputs.channel }}\`"
            echo "- Server Image: \`${{ needs.publish-images.outputs.server_image }}:${RELEASE_REF_NAME}\`"
            echo "- Web Image: \`${{ needs.publish-images.outputs.web_image }}:${RELEASE_REF_NAME}\`"
            echo "- Docker Runtime Agent Image: \`${{ needs.publish-images.outputs.agent_image }}:${RELEASE_REF_NAME}\`"
            echo
            printf '%s\n' "${CLIFF_RELEASE_NOTES}"
          } >> "${GITHUB_STEP_SUMMARY}"

  cleanup-failed-tag:
    name: Cleanup Failed Release Publication
    runs-on: ubuntu-latest
    if: ${{ always() && (needs.build-artifacts.result != 'success' || needs.bubble-smoke.result != 'success' || needs.publish-images.result != 'success' || needs.create-release.result != 'success') }}
    needs:
      - build-artifacts
      - bubble-smoke
      - publish-images
      - create-release

    permissions:
      contents: write
      packages: write

    steps:
      - name: Remove failed release identities when no GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.ref_name }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Refusing automatic cleanup for unsupported release tag '${RELEASE_TAG}'."
            exit 1
          fi

          api_root="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          release_response="$(mktemp)"
          release_status="$(curl -sS -o "${release_response}" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "${api_root}/releases/tags/${RELEASE_TAG}")"

          case "${release_status}" in
            200)
              echo "GitHub Release ${RELEASE_TAG} exists; preserving tag and published identity."
              echo "- Cleanup: skipped because the GitHub Release already exists." >> "${GITHUB_STEP_SUMMARY}"
              exit 0
              ;;
            404)
              ;;
            *)
              echo "::error::Cannot determine whether GitHub Release ${RELEASE_TAG} exists (HTTP ${release_status})."
              cat "${release_response}"
              exit 1
            ;;
          esac

          verify_release_tag() {
            local tag_response
            local tag_status
            local tag_object_type
            local tag_object_sha
            local tag_target_response
            local tag_target_status
            local tag_target_type
            local tag_target_sha

            tag_response="$(mktemp)"
            tag_status="$(curl -sS -o "${tag_response}" -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "${api_root}/git/ref/tags/${RELEASE_TAG}")"
            if [[ "${tag_status}" == "404" ]]; then
              echo "::error::Refusing GHCR cleanup: tag ${RELEASE_TAG} is absent."
              exit 1
            fi
            if [[ "${tag_status}" != "200" ]]; then
              echo "::error::Cannot inspect tag ${RELEASE_TAG} (HTTP ${tag_status})."
              cat "${tag_response}"
              exit 1
            fi

            tag_object_type="$(jq -er '.object.type' "${tag_response}")"
            tag_object_sha="$(jq -er '.object.sha' "${tag_response}")"
            case "${tag_object_type}" in
              commit)
                tag_target_sha="${tag_object_sha}"
                ;;
              tag)
                tag_target_response="$(mktemp)"
                tag_target_status="$(curl -sS -o "${tag_target_response}" -w '%{http_code}' \
                  -H 'Accept: application/vnd.github+json' \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  "${api_root}/git/tags/${tag_object_sha}")"
                if [[ "${tag_target_status}" != "200" ]]; then
                  echo "::error::Cannot resolve annotated tag ${RELEASE_TAG} target (HTTP ${tag_target_status})."
                  cat "${tag_target_response}"
                  exit 1
                fi
                tag_target_type="$(jq -er '.object.type' "${tag_target_response}")"
                if [[ "${tag_target_type}" != "commit" ]]; then
                  echo "::error::Refusing to clean ${RELEASE_TAG}: annotated tag resolves to ${tag_target_type}, not a commit."
                  exit 1
                fi
                tag_target_sha="$(jq -er '.object.sha' "${tag_target_response}")"
                ;;
              *)
                echo "::error::Refusing to clean ${RELEASE_TAG}: unsupported ref object type ${tag_object_type}."
                exit 1
                ;;
            esac

            if [[ "${tag_target_sha}" != "${TRIGGER_SHA}" ]]; then
              echo "::error::Refusing to clean ${RELEASE_TAG}: it resolves to ${tag_target_sha}, expected ${TRIGGER_SHA}."
              exit 1
            fi
          }

          case "${RELEASE_TAG}" in
            *-beta.*)
              release_owned_tags="$(jq -cn --arg tag "${RELEASE_TAG}" '[$tag]')"
              ;;
            *)
              release_owned_tags="$(jq -cn --arg tag "${RELEASE_TAG}" --arg version_tag "${RELEASE_TAG#v}" '[$tag, $version_tag] | sort')"
              ;;
          esac

          verify_release_tag

          owner_type="$(gh api "users/${REPOSITORY_OWNER}" --jq '.type')"
          case "${owner_type}" in
            User)
              package_owner_path="user/packages"
              ;;
            Organization)
              package_owner_path="orgs/${REPOSITORY_OWNER}/packages"
              ;;
            *)
              echo "::error::Cannot determine the GitHub Packages owner type for ${REPOSITORY_OWNER}: ${owner_type}."
              exit 1
              ;;
          esac

          deleted_package_versions=0
          cleanup_package() {
            local package_name="$1"
            local package_path="${package_owner_path}/container/${package_name}/versions"
            local versions_response
            local versions_error
            local shared_version_ids
            local version_ids
            local version_id

            versions_response="$(mktemp)"
            versions_error="$(mktemp)"
            if ! gh api --paginate --slurp "${package_path}?per_page=100" > "${versions_response}" 2> "${versions_error}"; then
              if grep -qE '(^|[^0-9])404([^0-9]|$)' "${versions_error}" "${versions_response}"; then
                echo "No GHCR package ${package_name} exists; skipping package-version cleanup."
                return
              fi

              echo "::error::Failed to list GHCR package versions for ${package_name}."
              cat "${versions_error}"
              cat "${versions_response}"
              exit 1
            fi

            shared_version_ids="$(jq -r --arg tag "${RELEASE_TAG}" --argjson expected_tags "${release_owned_tags}" '
              [ .[][]
                | select((.metadata.container.tags // []) | index($tag))
                | select(((.metadata.container.tags // []) | sort) != $expected_tags)
                | .id
              ] | .[]
            ' "${versions_response}")"
            if [[ -n "${shared_version_ids}" ]]; then
              echo "::error::Refusing to delete ${package_name}: ${RELEASE_TAG} is not the complete expected tag set on package version(s): ${shared_version_ids}."
              exit 1
            fi

            version_ids="$(jq -r --argjson expected_tags "${release_owned_tags}" '
              [ .[][]
                | select(((.metadata.container.tags // []) | sort) == $expected_tags)
                | .id
              ] | .[]
            ' "${versions_response}")"
            if [[ -z "${version_ids}" ]]; then
              echo "No exclusive ${package_name} package version is tagged ${RELEASE_TAG}."
              return
            fi

            while IFS= read -r version_id; do
              [[ -n "${version_id}" ]] || continue
              verify_release_tag
              gh api --method DELETE "${package_path}/${version_id}"
              deleted_package_versions=$((deleted_package_versions + 1))
              echo "Deleted failed GHCR package version ${package_name}/${version_id}."
            done <<< "${version_ids}"
          }

          cleanup_package graft-server
          cleanup_package graft-web
          cleanup_package graft-compose-runner
          cleanup_package graft-docker-runtime-agent

          verify_release_tag
          tag_response="$(mktemp)"
          delete_status="$(curl -sS -o "${tag_response}" -w '%{http_code}' -X DELETE \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "${api_root}/git/refs/tags/${RELEASE_TAG}")"
          if [[ "${delete_status}" != "204" ]]; then
            echo "::error::Failed to delete tag ${RELEASE_TAG} (HTTP ${delete_status})."
            cat "${tag_response}"
            exit 1
          fi

          echo "Deleted failed pre-Release tag ${RELEASE_TAG}."
          {
            echo "- Cleanup: deleted failed pre-Release tag \`${RELEASE_TAG}\`."
            if (( deleted_package_versions > 0 )); then
              echo "- Cleanup: deleted ${deleted_package_versions} GHCR package version(s) with the expected release-owned tags."
            else
              echo "- Cleanup: no GHCR package version required deletion."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-mutable-tags:
    name: Publish Mutable Container Tags
    runs-on: ubuntu-latest
    needs:
      - create-release
      - publish-images

    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve mutable channel tag
        id: mutable_channel
        env:
          RELEASE_SOURCE_CHANNEL: ${{ needs.publish-images.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          case "${RELEASE_SOURCE_CHANNEL}" in
            stable)
              mutable_tag="latest"
              ;;
            beta)
              mutable_tag="beta"
              ;;
            *)
              echo "::error::Unsupported release channel '${RELEASE_SOURCE_CHANNEL}'."
              exit 1
              ;;
          esac
          echo "tag=${mutable_tag}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish channel tag after release creation
        env:
          RELEASE_CHANNEL: ${{ steps.mutable_channel.outputs.tag }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          SERVER_IMAGE: ${{ needs.publish-images.outputs.server_image }}
          WEB_IMAGE: ${{ needs.publish-images.outputs.web_image }}
          RUNNER_IMAGE: ${{ needs.publish-images.outputs.runner_image }}
          AGENT_IMAGE: ${{ needs.publish-images.outputs.agent_image }}
          RUNNER_DIGEST: ${{ needs.publish-images.outputs.runner_digest }}
          AGENT_DIGEST: ${{ needs.publish-images.outputs.agent_digest }}
          RUNNER_REUSED: ${{ needs.publish-images.outputs.runner_reused }}
          AGENT_REUSED: ${{ needs.publish-images.outputs.agent_reused }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_REUSED}" == "true" ]]; then
            docker buildx imagetools create --prefer-index=false \
              --tag "${RUNNER_IMAGE}:${RELEASE_REF_NAME}" "${RUNNER_IMAGE}@${RUNNER_DIGEST}"
          fi
          if [[ "${AGENT_REUSED}" == "true" ]]; then
            docker buildx imagetools create --prefer-index=false \
              --tag "${AGENT_IMAGE}:${RELEASE_REF_NAME}" "${AGENT_IMAGE}@${AGENT_DIGEST}"
          fi
          for image in "${SERVER_IMAGE}" "${WEB_IMAGE}" "${RUNNER_IMAGE}" "${AGENT_IMAGE}"; do
            if [[ "${image}" == "${RUNNER_IMAGE}" || "${image}" == "${AGENT_IMAGE}" ]]; then
              docker buildx imagetools create --prefer-index=false \
                --tag "${image}:${RELEASE_CHANNEL}" "${image}:${RELEASE_REF_NAME}"
            else
              docker buildx imagetools create --tag "${image}:${RELEASE_CHANNEL}" "${image}:${RELEASE_REF_NAME}"
            fi
          done
