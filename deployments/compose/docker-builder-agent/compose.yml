services:
  vault:
    image: hashicorp/vault:1.20
    command: >-
      server -dev-tls -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN:?VAULT_DEV_ROOT_TOKEN is required}
      -dev-listen-address=0.0.0.0:8200
    cap_add: [IPC_LOCK]
    environment:
      VAULT_ADDR: https://0.0.0.0:8200
      VAULT_SKIP_VERIFY: "true"
    volumes:
      - vault-secrets:/conformance/secrets
    healthcheck:
      test: ["CMD", "vault", "status", "-tls-skip-verify"]
      interval: 3s
      timeout: 3s
      retries: 20

  vault-init:
    image: hashicorp/vault:1.20
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?VAULT_DEV_ROOT_TOKEN is required}
      VAULT_SKIP_VERIFY: "true"
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-graft-docker-builder-agent}
    entrypoint: ["/bin/sh", "/conformance/vault-init.sh"]
    volumes:
      - vault-secrets:/conformance/secrets
      - ./vault-init.sh:/conformance/vault-init.sh:ro
    restart: "no"

  backend:
    image: ${GRAFT_BACKEND_IMAGE:?GRAFT_BACKEND_IMAGE is required}
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      GRAFT_APP_ENV: conformance
      GRAFT_HTTP_ADDR: 0.0.0.0:8080
      GRAFT_CREDENTIAL_VAULT_ENABLED: "true"
      GRAFT_CREDENTIAL_VAULT_BACKEND: vault-pki
      GRAFT_CREDENTIAL_VAULT_ADDRESS: https://vault:8200
      GRAFT_CREDENTIAL_VAULT_CA_FILE: /run/secrets/ca.pem
      GRAFT_CREDENTIAL_VAULT_AUTH_MOUNT: approle
      GRAFT_CREDENTIAL_VAULT_AUTH_ROLE: graft-docker-builder-agent
      GRAFT_CREDENTIAL_VAULT_AUTH_ROLE_ID_FILE: /run/secrets/role_id
      GRAFT_CREDENTIAL_VAULT_AUTH_SECRET_ID_FILE: /run/secrets/secret_id
      GRAFT_CREDENTIAL_VAULT_PKI_MOUNT: pki
      GRAFT_CREDENTIAL_VAULT_PKI_ROLE: graft-docker-builder-agent
      GRAFT_CREDENTIAL_VAULT_TRUST_BUNDLE_REF: vault://pki/cert/ca
    volumes:
      - vault-secrets:/run/secrets:ro
    ports:
      - "${GRAFT_CONFORMANCE_BACKEND_PORT:-18080}:8080"

  docker-builder-agent:
    image: ${GRAFT_AGENT_IMAGE:?GRAFT_AGENT_IMAGE is required}
    depends_on:
      backend:
        condition: service_started
    command: ["--version"]
    volumes:
      - agent-config:/etc/graft/config
      - agent-state:/var/lib/graft-builder-agent/state
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  vault-secrets:
  agent-config:
  agent-state:
