services:
  postgres:
    profiles: ["isolated"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: graft
      POSTGRES_USER: graft
      POSTGRES_PASSWORD: graft
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ${GRAFT_DOCKER_RUNTIME_DEV_ROOT:?GRAFT_DOCKER_RUNTIME_DEV_ROOT is required}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graft -d graft"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  vault:
    image: hashicorp/vault:1.18
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: graft-docker-runtime-agent-dev
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["vault", "server", "-dev", "-dev-tls"]
    ports:
      - "127.0.0.1:18200:8200"
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true vault status >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30

  vault-init:
    image: hashicorp/vault:1.18
    restart: "no"
    user: "${GRAFT_DOCKER_RUNTIME_DEV_UID:?GRAFT_DOCKER_RUNTIME_DEV_UID is required}:${GRAFT_DOCKER_RUNTIME_DEV_GID:?GRAFT_DOCKER_RUNTIME_DEV_GID is required}"
    environment:
      GRAFT_DOCKER_RUNTIME_DEV_ROOT: /graft-dev
    entrypoint: ["/bin/sh", "/bootstrap/vault-init.sh"]
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ${GRAFT_DOCKER_RUNTIME_DEV_ROOT:?GRAFT_DOCKER_RUNTIME_DEV_ROOT is required}:/graft-dev
      - ./vault-init.sh:/bootstrap/vault-init.sh:ro
