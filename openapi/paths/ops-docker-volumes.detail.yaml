get:
  tags: [container]
  summary: Read Docker volume
  operationId: getDockerVolume
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/docker-volume-id-path.yaml
  security: [{ bearerAuth: [] }]
  responses:
    '200': { description: Docker volume., headers: { X-Request-Id: { $ref: ../components/headers/request-id.yaml } }, content: { application/json: { schema: { $ref: ../components/schemas/enveloped-docker-volume.yaml } } } }
    '400': { description: Invalid Docker volume reference., headers: { X-Request-Id: { $ref: ../components/headers/request-id.yaml } }, content: { application/json: { schema: { $ref: ../components/schemas/error-response.yaml } } } }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '404': { description: Volume not found., headers: { X-Request-Id: { $ref: ../components/headers/request-id.yaml } }, content: { application/json: { schema: { $ref: ../components/schemas/error-response.yaml } } } }
    '500': { $ref: ../components/responses/internal-server-error.yaml }
