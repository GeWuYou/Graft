post:
  tags: [container]
  summary: Submit a container start Task
  operationId: postContainerStart
  description: Submits one stopped container start action for asynchronous execution when dangerous actions are enabled.
  parameters:
    - name: Idempotency-Key
      in: header
      required: true
      description: Opaque caller-generated key used to replay the accepted Task receipt safely. Reusing a key with different submission input returns 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/container-id-path.yaml
  security:
    - bearerAuth: []
  responses:
    '202':
      description: Container start Task accepted.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-task-receipt.yaml
    '400':
      description: Invalid container reference.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      description: Container was not found.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '409':
      description: Container state does not allow this action, or Idempotency-Key was previously used with different submission input.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '500':
      $ref: ../components/responses/internal-server-error.yaml
