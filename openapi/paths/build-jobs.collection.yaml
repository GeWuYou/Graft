get:
  tags: [build]
  operationId: getBuildJobs
  summary: List Build-owned job projections
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    - in: query
      name: offset
      schema: { type: integer, minimum: 0, default: 0 }
    - in: query
      name: search
      description: Optional case-insensitive search over Build ID, Snapshot digest, repository, and image tag.
      schema: { type: string, minLength: 1, maxLength: 255 }
    - in: query
      name: image_repository
      description: Optional exact Build snapshot image repository.
      schema: { type: string, minLength: 1, maxLength: 255 }
    - in: query
      name: image_tag
      description: Optional exact Build snapshot image tag.
      schema: { type: string, minLength: 1, maxLength: 255 }
    - in: query
      name: build_status
      description: Optional product-level Build Task status filter.
      schema: { $ref: ../components/schemas/build-status-filter.yaml }
    - in: query
      name: builder_id
      description: Optional exact runtime target snapshot identifier.
      schema: { type: integer, format: int64, minimum: 1 }
    - in: query
      name: created_after
      description: Optional inclusive RFC 3339 lower bound for the Build snapshot creation time.
      schema: { type: string, format: date-time }
    - in: query
      name: created_before
      description: Optional inclusive RFC 3339 upper bound for the Build snapshot creation time.
      schema: { type: string, format: date-time }
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Build job projection page.
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-build-job-list.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '500': { $ref: ../components/responses/internal-server-error.yaml }

post:
  tags: [build]
  operationId: postBuildJob
  summary: Submit an immutable Build execution plan for an available Input Snapshot
  parameters:
    - name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/build-job-create-request.yaml
  responses:
    '202':
      description: Build execution plan Task accepted.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-task-receipt.yaml
    '400': { description: Invalid build request }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '409': { description: Idempotency-Key was previously used with different build input. }
    '500': { $ref: ../components/responses/internal-server-error.yaml }
