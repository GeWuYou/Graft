get:
  tags: [rbac]
  summary: List role bindings for one user
  operationId: getUserRoles
  x-graft-mcp:
    risk:
      level: low
      reason: Reads existing role bindings without changing authorization.
      reversible: true
      impact: Does not change user access.
    confirmation:
      required: false
      strategy: none
      ttl: PT0S
  description: Returns the role id snapshot currently bound to the target user.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      examples:
        existing:
          summary: Existing user id
          value: 42
  security:
    - bearerAuth: []
  responses:
    '200':
      description: User role binding snapshot.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-user-role-binding-response.yaml
          examples:
            default:
              summary: User role ids
              value:
                success: true
                code: OK
                message: success
                traceId: 273c9565-6c53-44ee-bf4b-ee89523911b2
                data:
                  role_ids: [1, 3]
    '400':
      description: Invalid user id.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
          examples:
            invalidUserID:
              summary: Invalid user id
              value:
                success: false
                code: COMMON_INVALID_ARGUMENT
                message: 请求参数不合法
                traceId: 1c4afd49-5238-44e7-baad-8e0144df0984
                messageKey: common.invalid_argument
                locale: zh-CN
                data:
                  field: id
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      description: User not found.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
          examples:
            userNotFound:
              summary: Target user does not exist
              value:
                success: false
                code: USER_NOT_FOUND
                message: 用户不存在
                traceId: 52ef74f5-cf73-4cb8-ae6f-2b73ca4b0d87
                messageKey: user.not_found
                locale: zh-CN
                data: {}
    '500':
      $ref: ../components/responses/internal-server-error.yaml
delete:
  tags: [rbac]
  summary: Remove role bindings for one user
  operationId: deleteUserRoles
  description: >-
    Removes the supplied role ids from the target user in one atomic transaction. All role ids and protected-account
    invariants are validated before the write; validation failure commits no relationship change.
  x-graft-destructive:
    kind: relationship_remove
    effect: relationship_removal
    execution: synchronous
    retry:
      mode: tombstone_idempotent
    result:
      status: 200
    authorization:
      owner_check: false
    audit:
      required: true
    confirmation:
      required: true
    exposure:
      mcp: false
    batch:
      mode: atomic
      max_items: 100
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/remove-user-roles-request.yaml
  responses:
    '200':
      description: User role bindings were removed atomically.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-destructive-batch-result.yaml
    '400':
      description: Invalid user id or role id set; no relationship change was committed.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      description: User or role not found; no relationship change was committed.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '409':
      description: User-role lifecycle conflict; no relationship change was committed.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '500':
      $ref: ../components/responses/internal-server-error.yaml
