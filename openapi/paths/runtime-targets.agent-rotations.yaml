post:
  tags: [runtime-target]
  summary: Rotate an experimental Runtime Target Agent generation
  operationId: postRuntimeTargetAgentRotation
  description: Revokes the current generation before creating a pending replacement generation. Rotation is not a dual-acceptance path.
  security: [{bearerAuth: []}]
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/runtime-target-id-path.yaml
    - name: agentId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,127}$'}
  requestBody:
    required: true
    content:
      application/json:
        schema: {$ref: ../components/schemas/runtime-target-agent-rotation-request.yaml}
  responses:
    '201':
      description: Pending replacement enrollment created after the prior generation was disabled.
      content:
        application/json:
          schema: {$ref: ../components/schemas/enveloped-runtime-target-agent-enrollment.yaml}
    '400': {$ref: ../components/responses/bad-request.yaml}
    '401': {$ref: ../components/responses/unauthorized.yaml}
    '403': {$ref: ../components/responses/forbidden.yaml}
    '404': {$ref: ../components/responses/not-found.yaml}
    '409':
      description: The Agent binding cannot be rotated in its current lifecycle state.
      content:
        application/json:
          schema: {$ref: ../components/schemas/error-response.yaml}
    '503':
      description: The credential-vault trust backend is unavailable.
      content:
        application/json:
          schema: {$ref: ../components/schemas/agent-unavailable-error-response.yaml}
