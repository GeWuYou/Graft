get:
  tags: [runtime-target]
  summary: List runtime targets
  operationId: getRuntimeTargets
  security: [{bearerAuth: []}]
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
  responses:
    '200':
      description: Runtime target list.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-runtime-target-list-response.yaml
    '401': {$ref: ../components/responses/unauthorized.yaml}
    '403': {$ref: ../components/responses/forbidden.yaml}
    '500': {$ref: ../components/responses/internal-server-error.yaml}
