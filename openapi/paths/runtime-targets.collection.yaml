get:
  tags: [runtime-target]
  summary: List runtime targets
  operationId: getRuntimeTargets
  x-graft-mcp:
    risk:
      level: low
      reason: Reads runtime target summaries without changing target configuration or availability.
      reversible: true
      impact: Does not change runtime target state.
    confirmation:
      required: false
      strategy: none
      ttl: PT0S
  security: [{bearerAuth: []}]
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - name: limit
      in: query
      schema: {type: integer, enum: [10, 20, 50, 100], default: 10}
    - name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    - { name: keyword, in: query, schema: { type: string, maxLength: 128 } }
    - { name: provider, in: query, schema: { type: string, enum: [docker] } }
    - { name: connection_kind, in: query, schema: { type: string, enum: [unix_socket] } }
    - { name: health, in: query, schema: { type: string, enum: [healthy, unavailable], x-enum-varnames: [GetRuntimeTargetsParamsHealthHealthy, GetRuntimeTargetsParamsHealthUnavailable] } }
    - { name: sort, in: query, schema: { type: string, enum: [display_name:asc, display_name:desc, provider:asc, provider:desc, health:asc, health:desc], x-enum-varnames: [GetRuntimeTargetsParamsSortDisplayNameAsc, GetRuntimeTargetsParamsSortDisplayNameDesc, GetRuntimeTargetsParamsSortProviderAsc, GetRuntimeTargetsParamsSortProviderDesc, GetRuntimeTargetsParamsSortHealthAsc, GetRuntimeTargetsParamsSortHealthDesc], default: display_name:asc } }
  responses:
    '200':
      description: Runtime target list.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-runtime-target-list-response.yaml
    '401': {$ref: ../components/responses/unauthorized.yaml}
    '403': {$ref: ../components/responses/forbidden.yaml}
    '500': {$ref: ../components/responses/internal-server-error.yaml}
