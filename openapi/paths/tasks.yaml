get:
  tags: [tasks]
  summary: List Task history
  operationId: listTasks
  description: Lists persisted Task history within resources authorized for the caller; a Task ID alone never grants access.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - in: query
      name: owner_type
      schema: { type: string }
    - in: query
      name: owner_id
      schema: { type: string }
    - in: query
      name: type
      schema: { type: string }
    - in: query
      name: status
      schema: { $ref: ../components/schemas/task-status.yaml }
    - in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    - in: query
      name: offset
      schema: { type: integer, minimum: 0, default: 0 }
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Authorized Task history.
      headers:
        X-Request-Id: { $ref: ../components/headers/request-id.yaml }
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-task-list-response.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '500': { $ref: ../components/responses/internal-server-error.yaml }
