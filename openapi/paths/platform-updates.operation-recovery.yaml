post:
  tags: [platform-update]
  summary: Recover a lost or corrupt self-update runner
  operationId: postPlatformUpdateOperationRecovery
  description: Starts one protected, one-shot recovery runner for a `runner_lost` or `runner_state_corrupt` operation after the loss window. A verified snapshot must be pre-migration and non-terminal; a missing or corrupt snapshot is quarantined by the state-volume-only recovery runner. The server never resumes the upgrade or fabricates a lifecycle phase.
  security: [{ bearerAuth: [] }]
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - name: operationID
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
  responses:
    '202':
      description: Recovery runner accepted by Docker. Read the operation snapshot for the recovery result.
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-platform-update-operation-launch-acknowledgement.yaml }
    '400':
      description: Invalid operation identity.
      content:
        application/json:
          schema: { $ref: ../components/schemas/error-response.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '404':
      description: Update operation not found.
      content:
        application/json:
          schema: { $ref: ../components/schemas/error-response.yaml }
    '409':
      description: The runner lease has not expired, the operation is already terminal, or recovery has already been accepted.
      content:
        application/json:
          schema: { $ref: ../components/schemas/error-response.yaml }
    '500': { $ref: ../components/responses/internal-server-error.yaml }
    '503':
      description: Runner state, recovery launcher, or configured recovery image is temporarily unavailable.
      content:
        application/json:
          schema: { $ref: ../components/schemas/error-response.yaml }
