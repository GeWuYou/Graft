get:
  tags: [tasks]
  summary: List Task Stages
  operationId: listTaskStages
  x-graft-mcp:
    risk: { level: low, reason: Lists existing Task stage records, reversible: true, impact: Does not change Task state. }
    confirmation: { required: false, strategy: none, ttl: PT0S }
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - in: path
      name: taskId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Authoritative ordered Stage lifecycle records.
      headers:
        X-Request-Id: { $ref: ../components/headers/request-id.yaml }
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-task-stage-list-response.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '404':
      description: Task was not found.
      headers:
        X-Request-Id: { $ref: ../components/headers/request-id.yaml }
      content:
        application/json:
          schema: { $ref: ../components/schemas/error-response.yaml }
    '500': { $ref: ../components/responses/internal-server-error.yaml }
