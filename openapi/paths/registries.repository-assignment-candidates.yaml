get:
  tags: [registry]
  operationId: getRegistryRepositoryAssignmentCandidates
  summary: List user candidates for selected Artifact Repositories
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/registry-connection-ref-path.yaml
    - name: repository_ref
      in: query
      required: true
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 100
        items: { type: string, minLength: 1 }
    - name: search
      in: query
      schema: { type: string }
    - name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    - name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  security: [{bearerAuth: []}]
  responses:
    '200':
      description: Candidate users with authorization state aggregated over the selected repositories.
      content:
        application/json:
          schema: {$ref: ../components/schemas/enveloped-registry-repository-assignment-candidate-list-response.yaml}
    '400': {$ref: ../components/responses/bad-request.yaml}
    '401': {$ref: ../components/responses/unauthorized.yaml}
    '403': {$ref: ../components/responses/forbidden.yaml}
    '404': {$ref: ../components/responses/not-found.yaml}
    '500': {$ref: ../components/responses/internal-server-error.yaml}
