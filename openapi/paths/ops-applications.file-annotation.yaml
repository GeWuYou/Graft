put:
  tags: [application]
  summary: Update one application workspace file or directory annotation
  operationId: putApplicationFileAnnotation
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/application-id-path.yaml
    - $ref: ../components/parameters/application-workspace-path-query.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/application-file-annotation-request.yaml
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Updated application workspace tree item with resolved tooltip and annotation state.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-application-file-tree-item-response.yaml
    '400':
      description: Invalid application id, path, or annotation payload.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      description: Application record or target path not found.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '500':
      $ref: ../components/responses/internal-server-error.yaml
