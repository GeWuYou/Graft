get:
  tags: [monitor]
  summary: Read current server status snapshot
  operationId: getMonitorServerStatus
  description: >-
    Returns the current aggregated monitor server-status snapshot, optional Redis-backed runtime trends, and bounded
    per-dependency history. PostgreSQL and Redis diagnostics are optional current fields; a history read failure is
    represented in that dependency history and never fails the current snapshot. Current diagnostics are the active
    monitor anomalies in this response only; this route does not persist anomalies or create notifications.
  x-graft-mcp:
    risk: { level: low, reason: Reads the current aggregated server-status snapshot, reversible: true, impact: Does not change monitor or runtime state. }
    confirmation: { required: false, strategy: none, ttl: PT0S }
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/trend-range-query.yaml
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Server status snapshot.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-server-status-response.yaml
          examples:
            default:
              summary: Current server status snapshot
