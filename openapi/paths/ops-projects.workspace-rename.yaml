post:
  tags: [project]
  summary: Rename a project workspace file or directory
  operationId: postProjectWorkspaceEntryRename
  parameters:
    - $ref: ../components/parameters/project-id-path.yaml
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: ../components/schemas/project-workspace-entry-rename-request.yaml }
  responses:
    '204': { description: Workspace entry renamed. }
    '400': { description: Invalid workspace entry request. }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '409': { description: Workspace entry already exists. }
