post:
  tags: [application]
  summary: Submit a managed Compose application create request
  operationId: postApplicationCreate
  description: Creates one managed Compose application under the configured managed root, writes the requested Compose and optional env files, and persists the application registry bootstrap.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/application-create-request.yaml
  security:
    - bearerAuth: []
  responses:
    '201':
      description: Managed Compose application created and registered.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-application-create-response.yaml
    '400':
      description: Invalid managed create input, Compose configuration, managed-root authority, or workspace materialization. The response code identifies the safe failure category and the trace id correlates the server diagnostic log.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '409':
      description: Managed create request blocked by managed-root authority, ownership, or runtime guard.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '500':
      $ref: ../components/responses/internal-server-error.yaml
