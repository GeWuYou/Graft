get:
  tags: [tasks]
  summary: Replay Task events
  operationId: listTaskEvents
  description: Returns only non-derivable Task lifecycle, retry, cancellation, and recovery facts.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - in: path
      name: taskId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    - in: query
      name: after_sequence
      schema: { type: integer, format: int64, minimum: 0, default: 0 }
    - in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Task event replay page.
      headers:
        X-Request-Id: { $ref: ../components/headers/request-id.yaml }
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-task-event-list-response.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '404':
      description: Task was not found.
      headers:
        X-Request-Id: { $ref: ../components/headers/request-id.yaml }
      content:
        application/json:
          schema: { $ref: ../components/schemas/error-response.yaml }
    '500': { $ref: ../components/responses/internal-server-error.yaml }
