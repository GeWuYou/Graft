get:
  tags: [platform-update]
  summary: List self-update history
  operationId: getPlatformUpdateOperations
  security: [{ bearerAuth: [] }]
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    '200':
      description: Update operation history without deployment secrets or receipt contents.
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-platform-update-operation-list.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
post:
  tags: [platform-update]
  summary: Confirm and start an official Compose update
  operationId: postPlatformUpdateOperation
  description: Starts a one-shot digest-pinned runner only for the currently verified target release. When Docker discovery is active, it accepts only an opaque Compose root candidate key; it never accepts commands, image references, or host paths from the request.
  security: [{ bearerAuth: [] }]
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: ../components/schemas/create-platform-update-operation-request.yaml }
  responses:
    '202':
      description: The one-shot runner was accepted by Docker.
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-platform-update-operation.yaml }
    '400': { description: Invalid target version or request payload. The error data.reason contains a stable safe failure code. }
    '412': { description: The verified release catalog or installation preflight rejected execution. The error data.reason contains a stable safe failure code. }
    '500': { description: "Update preparation, persistence, or runner launch failed. The error data.reason contains a stable safe failure code and the X-Request-Id response header correlates server logs." }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
