get:
  tags: [rbac]
  summary: List private role-list saved views
  operationId: getRoleSavedViews
  parameters: [{ $ref: ../components/parameters/locale-header.yaml }, { $ref: ../components/parameters/request-id-header.yaml }]
  security: [{ bearerAuth: [] }]
  responses:
    '200': { description: Current user's role-list views., content: { application/json: { schema: { $ref: ../components/schemas/enveloped-saved-view-list-response.yaml } } } }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
post:
  tags: [rbac]
  summary: Create a private role-list saved view
  operationId: postRoleSavedView
  parameters: [{ $ref: ../components/parameters/locale-header.yaml }, { $ref: ../components/parameters/request-id-header.yaml }]
  security: [{ bearerAuth: [] }]
  requestBody: { required: true, content: { application/json: { schema: { $ref: ../components/schemas/saved-view-request.yaml } } } }
  responses:
    '201': { description: Saved view created., content: { application/json: { schema: { $ref: ../components/schemas/enveloped-saved-view.yaml } } } }
    '400': { description: Invalid saved-view state. }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '409': { description: Duplicate saved-view name. }
