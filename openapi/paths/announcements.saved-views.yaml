get:
  tags: [announcements]
  summary: List private announcement saved views
  operationId: getAnnouncementSavedViews
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Current user's saved announcement views.
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-saved-view-list-response.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
post:
  tags: [announcements]
  summary: Create a private announcement saved view
  operationId: postAnnouncementSavedView
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: ../components/schemas/saved-view-request.yaml }
  responses:
    '201':
      description: Saved view created.
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-saved-view.yaml }
    '400': { description: Invalid saved-view state. }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '409': { description: Duplicate saved-view name. }
