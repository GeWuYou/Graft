post:
  tags: [platform-network]
  summary: Run connectivity diagnostics for one target
  operationId: postPlatformConnectivityRun
  description: The URL identifies the target. It never accepts a caller-provided network destination.
  security: [{ bearerAuth: [] }]
  parameters:
    - name: targetId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    '200': { description: Sanitized persisted report and check projection., content: { application/json: { schema: { type: object } } } }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '404': { description: Target not registered. }
