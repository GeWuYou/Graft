get:
  tags: [platform-network]
  summary: Read one sanitized connectivity report
  operationId: getPlatformConnectivityReport
  security: [{ bearerAuth: [] }]
  parameters:
    - name: targetId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    - name: checkId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    '200': { description: "Versioned report with extensible probes, route explanation, and only a masked exit IP.", content: { application/json: { schema: { type: object } } } }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '404': { description: Target or report not found. }
