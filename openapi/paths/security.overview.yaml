get:
  tags: [security]
  summary: Read security overview
  operationId: getSecurityOverview
  x-graft-mcp:
    risk:
      level: low
      reason: Reads a bounded security posture snapshot without changing policy.
      reversible: true
      impact: Does not change access control or audit state.
    confirmation:
      required: false
      strategy: none
      ttl: PT0S
  description: Returns one bounded snapshot of access-control posture and audit security signals.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - name: preset
      in: query
      required: false
      schema:
        type: string
        enum: [last_24h, last_7d, last_30d]
        default: last_24h
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Security overview snapshot.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-security-overview-response.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '500':
      $ref: ../components/responses/internal-server-error.yaml
