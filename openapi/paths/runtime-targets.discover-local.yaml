post:
  tags: [runtime-target]
  summary: Discover or recover Local Docker
  operationId: postRuntimeTargetsDiscoverLocalDocker
  security: [{bearerAuth: []}]
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
  responses:
    '200':
      description: Local Docker discovery completed. Data is null when no local Docker socket exists.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-runtime-target-response.yaml
    '401': {$ref: ../components/responses/unauthorized.yaml}
    '403': {$ref: ../components/responses/forbidden.yaml}
    '500': {$ref: ../components/responses/internal-server-error.yaml}
