post:
  tags: [container]
  summary: Submit a container restart Task
  operationId: postContainerRestart
  description: Submits one container restart action for asynchronous execution when dangerous actions are enabled.
  x-graft-mcp:
    resource_uri_templates:
      - graft://docker/containers/{id}
    resource_uri_parameter_bindings:
      id: id
    risk:
      level: high
      reason: Restarts a running workload and interrupts its service.
      reversible: true
      impact: The container is stopped and started again.
    confirmation:
      required: true
      strategy: two_phase
      ttl: PT5M
  parameters:
    - $ref: ../components/parameters/idempotency-key.yaml
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/container-id-path.yaml
  security:
    - bearerAuth: []
  responses:
    '202':
      description: Container restart Task accepted.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-task-receipt.yaml
    '400':
      description: Invalid container reference.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      description: Container was not found.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '409':
      description: Container state does not allow this action, or Idempotency-Key was previously used with different submission input.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '500':
      $ref: ../components/responses/internal-server-error.yaml
