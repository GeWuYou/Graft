get:
  tags: [application]
  summary: Get one Compose application summary
  operationId: getApplication
  x-graft-mcp:
    resource_uri_templates:
      - graft://applications/{id}
    resource_uri_parameter_bindings:
      id: applicationId
    risk:
      level: low
      reason: Reads one registered application's existing summary.
      reversible: true
      impact: Does not change application state.
    confirmation:
      required: false
      strategy: none
      ttl: PT0S
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/application-id-path.yaml
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Compose application summary.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-application-detail-response.yaml
    '400':
      description: Invalid application id.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      description: Application record not found.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '500':
      $ref: ../components/responses/internal-server-error.yaml
