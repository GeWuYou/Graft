post:
  tags: [application]
  summary: Create a managed Compose application from a runtime template directory
  operationId: postApplicationCreateTemplate
  description: Materializes one operator-managed text workspace template from Application Root templates/<template-key> under the managed root, then registers it without running Compose lifecycle commands.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/application-template-create-request.yaml
  security:
    - bearerAuth: []
  responses:
    '201':
      description: Template workspace materialized and application registered.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-application-create-response.yaml
    '400':
      description: Invalid template create request.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
