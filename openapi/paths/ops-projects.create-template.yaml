post:
  tags: [project]
  summary: Create a managed Compose project from a bundled template
  operationId: postProjectCreateTemplate
  description: Materializes one explicit bundled text workspace template under the managed root, then registers it without running Compose lifecycle commands.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/project-template-create-request.yaml
  security:
    - bearerAuth: []
  responses:
    '201':
      description: Template workspace materialized and project registered.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-project-create-response.yaml
    '400':
      description: Invalid template create request.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
