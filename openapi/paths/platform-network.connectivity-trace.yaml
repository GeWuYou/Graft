get:
  tags: [platform-network]
  summary: Read sanitized connectivity probe trace
  operationId: getPlatformConnectivityTrace
  security: [{ bearerAuth: [] }]
  parameters:
    - { name: targetId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    - { name: checkId, in: path, required: true, schema: { type: integer, minimum: 1 } }
  responses:
    '200': { description: Ordered sanitized ProbeResult projection., content: { application/json: { schema: { type: object } } } }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
