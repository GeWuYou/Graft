post:
  tags: [project]
  summary: Validate a Git project source
  operationId: postProjectCreateGitValidate
  description: Resolves a Git workspace in isolated temporary staging and validates the eventual managed-root target without writing it.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/project-git-create-request.yaml
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Git source validation result.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-project-create-validate-response.yaml
    '400':
      $ref: ../components/responses/internal-server-error.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
