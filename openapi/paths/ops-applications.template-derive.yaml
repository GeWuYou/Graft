post:
  tags: [application]
  summary: Derive an editable draft from a published template version
  operationId: postApplicationTemplateDerive
  parameters:
    - name: templateId
      in: path
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [template_version_id]
          properties:
            template_version_id: { type: string }
  responses:
    '201':
      description: Derived template draft.
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-application-template-response.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '409': { description: A draft already exists or source is not published. }
