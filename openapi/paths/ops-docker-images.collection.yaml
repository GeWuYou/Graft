get:
  tags: [container]
  summary: List Docker images
  operationId: getDockerImages
  description: Returns a stable page of Docker images. The summary describes the complete configured runtime inventory and is independent of the keyword filter.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/docker-image-list-limit.yaml
    - $ref: ../components/parameters/docker-image-list-offset.yaml
    - $ref: ../components/parameters/docker-image-list-keyword.yaml
  security: [{ bearerAuth: [] }]
  responses:
    '200':
      description: Docker image list.
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-docker-image-list-response.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '500': { $ref: ../components/responses/internal-server-error.yaml }
