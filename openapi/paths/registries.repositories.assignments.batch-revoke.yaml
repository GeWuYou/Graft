post:
  tags: [registry]
  operationId: postRegistryArtifactRepositoryAssignmentsBatchRevoke
  summary: Revoke users from Artifact Repositories in one transaction
  description: Validates all requested repositories and users before soft-deleting active assignments. Missing assignments are ignored.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/registry-connection-ref-path.yaml
  security: [{bearerAuth: []}]
  requestBody:
    required: true
    content:
      application/json:
        schema: {$ref: ../components/schemas/registry-artifact-repository-assignment-batch-revoke-request.yaml}
  responses:
    '200':
      description: Active Repository user assignments were revoked atomically.
      content:
        application/json:
          schema: {$ref: ../components/schemas/enveloped-registry-artifact-repository-assignment-batch-revoke-result.yaml}
    '400': {$ref: ../components/responses/bad-request.yaml}
    '401': {$ref: ../components/responses/unauthorized.yaml}
    '403': {$ref: ../components/responses/forbidden.yaml}
    '404': {$ref: ../components/responses/not-found.yaml}
    '500': {$ref: ../components/responses/internal-server-error.yaml}
