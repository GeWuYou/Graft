get:
  tags: [application]
  summary: List published compatible Application templates
  operationId: getApplicationTemplates
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - name: deployment_adapter_kind
      in: query
      schema: { type: string, enum: [compose] }
    - name: q
      in: query
      description: Case-insensitive template name and description search term.
      schema: { type: string, maxLength: 128 }
    - name: category
      in: query
      schema: { $ref: ../components/schemas/application-template-category.yaml }
    - name: sort
      in: query
      schema: { type: string, enum: [updated_desc, name_asc], default: updated_desc }
    - name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    - name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
  responses:
    '200':
      description: Published Application templates.
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-application-template-catalog-list-response.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
post:
  tags: [application]
  summary: Create an empty Application template draft
  operationId: postApplicationTemplate
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: ../components/schemas/application-template-draft-request.yaml }
  responses:
    '201':
      description: Application template draft created.
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-application-template-response.yaml }
    '400': { description: Invalid template draft input. }
    '409': { description: A live Application template already uses the requested display name. }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
