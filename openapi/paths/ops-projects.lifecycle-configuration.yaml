put:
  tags: [project]
  summary: Save one project's lifecycle configuration
  operationId: putProjectLifecycleConfiguration
  description: >
    Saves the canonical lifecycle configuration for one registered local project, regenerates lifecycle command
    previews, and confirms imported-project defaults so later `up`, `stop`, `restart`, and `redeploy` actions can
    reuse one project-owned compose strategy instead of guessing raw shell commands.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/project-id-path.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/project-lifecycle-configuration-request.yaml
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Saved lifecycle configuration and regenerated command previews.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-project-lifecycle-configuration-response.yaml
    '400':
      description: Invalid project id or lifecycle configuration payload.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      description: Project record not found.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '409':
      description: Lifecycle configuration update blocked by project authority or bounded host-scope guards.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '500':
      $ref: ../components/responses/internal-server-error.yaml
