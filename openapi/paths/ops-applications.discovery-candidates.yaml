get:
  tags: [application]
  summary: List bounded application discovery candidates
  operationId: getApplicationDiscoveryCandidates
  description: Returns local directory-scan and auto-discovery candidate previews under the current application authority without auto-registering applications or changing runtime ownership.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Application discovery candidate preview list.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-application-discovery-candidates-response.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '500':
      $ref: ../components/responses/internal-server-error.yaml
