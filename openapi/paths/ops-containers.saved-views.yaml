get:
  tags: [container]
  summary: List private container-list saved views
  operationId: getContainerSavedViews
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
  security: [{ bearerAuth: [] }]
  responses:
    '200': { description: Current user's container-list views., content: { application/json: { schema: { $ref: ../components/schemas/enveloped-saved-view-list-response.yaml } } } }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
post:
  tags: [container]
  summary: Create a private container-list saved view
  operationId: postContainerSavedView
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
  security: [{ bearerAuth: [] }]
  requestBody: { required: true, content: { application/json: { schema: { $ref: ../components/schemas/saved-view-request.yaml } } } }
  responses:
    '201': { description: Saved view created., content: { application/json: { schema: { $ref: ../components/schemas/enveloped-saved-view.yaml } } } }
    '400': { description: Invalid saved-view state. }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '409': { description: Duplicate saved-view name. }
