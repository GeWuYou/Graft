post:
  tags: [container]
  summary: Remove Docker volumes in batch
  operationId: postDockerVolumeBatchRemove
  description: Submits one Task with ordered per-volume external stages. Execution is fail-fast; a failed stage stops later stages, and every uncertain side effect requires manual reconciliation.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/idempotency-key.yaml
  security: [{ bearerAuth: []}]
  requestBody:
    required: true
    content:
      application/json: { schema: { $ref: ../components/schemas/docker-volume-batch-remove-request.yaml } }
  responses:
    '202':
      description: Ordered Docker volume removal Task accepted.
      content: { application/json: { schema: { $ref: ../components/schemas/enveloped-task-receipt.yaml } } }
    '400': { description: Invalid batch volume removal request., content: { application/json: { schema: { $ref: ../components/schemas/error-response.yaml } } } }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '409': { description: Idempotency-Key conflicts with a different submission. }
    '500': { $ref: ../components/responses/internal-server-error.yaml }
