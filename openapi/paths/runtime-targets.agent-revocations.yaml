post:
  tags: [runtime-target]
  summary: Revoke an experimental Runtime Target Agent generation
  operationId: postRuntimeTargetAgentRevocation
  description: Immediately revokes the current Agent generation and appends a redacted audit fact. The operation is idempotent.
  security: [{bearerAuth: []}]
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/runtime-target-id-path.yaml
    - name: agentId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,127}$'}
  requestBody:
    required: true
    content:
      application/json:
        schema: {$ref: ../components/schemas/runtime-target-agent-revocation-request.yaml}
  responses:
    '200':
      description: The Agent generation is revoked or was already revoked.
      content:
        application/json:
          schema: {$ref: ../components/schemas/enveloped-runtime-target-agent-binding.yaml}
    '400': {$ref: ../components/responses/bad-request.yaml}
    '401': {$ref: ../components/responses/unauthorized.yaml}
    '403': {$ref: ../components/responses/forbidden.yaml}
    '404': {$ref: ../components/responses/not-found.yaml}
    '503':
      description: The Runtime Target control-plane store or credential-vault trust backend is unavailable.
      content:
        application/json:
          schema: {$ref: ../components/schemas/agent-unavailable-error-response.yaml}
