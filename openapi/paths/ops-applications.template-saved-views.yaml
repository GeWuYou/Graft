get:
  tags: [application]
  summary: List private application-template saved views
  operationId: getApplicationTemplateSavedViews
  security: [{ bearerAuth: [] }]
  responses: { '200': { description: Current user's template-list views., content: { application/json: { schema: { $ref: ../components/schemas/enveloped-saved-view-list-response.yaml } } } } }
post:
  tags: [application]
  summary: Create a private application-template saved view
  operationId: postApplicationTemplateSavedView
  security: [{ bearerAuth: [] }]
  requestBody: { required: true, content: { application/json: { schema: { $ref: ../components/schemas/saved-view-request.yaml } } } }
  responses: { '201': { description: Saved view created., content: { application/json: { schema: { $ref: ../components/schemas/enveloped-saved-view.yaml } } } }, '400': { description: Invalid saved-view state. }, '409': { description: Duplicate saved-view name. } }
