put:
  tags: [audit]
  summary: Update a private audit-log saved view
  operationId: putAuditLogSavedView
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/saved-view-id.yaml
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/saved-view-request.yaml
  responses:
    '200':
      description: Saved view updated.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-saved-view.yaml
    '400': { description: Invalid saved-view state. }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '404': { description: Saved view was not found. }
    '409': { description: Duplicate saved-view name. }
delete:
  tags: [audit]
  summary: Delete a private audit-log saved view
  operationId: deleteAuditLogSavedView
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/saved-view-id.yaml
  security:
    - bearerAuth: []
  responses:
    '204': { description: Saved view deleted. }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '404': { description: Saved view was not found. }
