get:
  tags: [runtime-target]
  summary: Read an experimental Runtime Target Agent binding
  operationId: getRuntimeTargetAgentBinding
  description: Returns redacted status and diagnostics for one Runtime Target Agent binding. It never exposes private key, certificate PEM, bootstrap secret, or endpoint credential material.
  security: [{bearerAuth: []}]
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/runtime-target-id-path.yaml
    - name: agentId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,127}$'}
  responses:
    '200':
      description: Redacted Agent binding.
      content:
        application/json:
          schema: {$ref: ../components/schemas/enveloped-runtime-target-agent-binding.yaml}
    '400': {$ref: ../components/responses/bad-request.yaml}
    '401': {$ref: ../components/responses/unauthorized.yaml}
    '403': {$ref: ../components/responses/forbidden.yaml}
    '404': {$ref: ../components/responses/not-found.yaml}
    '503':
      description: The Runtime Target control-plane store or credential-vault trust backend is unavailable.
      content:
        application/json:
          schema: {$ref: ../components/schemas/agent-unavailable-error-response.yaml}
