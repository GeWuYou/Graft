post:
  tags: [application]
  summary: Archive an Application template
  operationId: postApplicationTemplateArchive
  parameters:
    - name: templateId
      in: path
      required: true
      schema: { type: string }
  responses:
    '204': { description: Template archived. }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
