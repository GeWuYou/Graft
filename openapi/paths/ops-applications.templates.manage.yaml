get:
  tags: [application]
  summary: List all Application templates for management
  operationId: getApplicationManagedTemplates
  responses:
    '200':
      description: Application template management catalog, including drafts and archived templates.
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-application-template-list-response.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
