get:
  tags: [application]
  summary: List applications
  operationId: getApplications
  description: Returns application applicationions. Compose remains the only supported application type and Runtime Target remains the target/provider authority.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/application-list-limit.yaml
    - $ref: ../components/parameters/application-list-offset.yaml
    - $ref: ../components/parameters/application-list-keyword.yaml
    - $ref: ../components/parameters/application-list-application-type.yaml
    - $ref: ../components/parameters/application-list-runtime-target-id.yaml
    - $ref: ../components/parameters/application-list-provider.yaml
    - $ref: ../components/parameters/application-list-source-type.yaml
    - $ref: ../components/parameters/application-list-runtime-status.yaml
    - $ref: ../components/parameters/application-list-drift-status.yaml
    - $ref: ../components/parameters/application-list-sort.yaml
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Compose application list.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-application-list-response.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '500':
      $ref: ../components/responses/internal-server-error.yaml
