post:
  tags: [application]
  summary: Inspect one runtime Compose import candidate
  operationId: postApplicationImportRuntimeInspect
  x-graft-mcp:
    risk:
      level: low
      reason: Produces a bounded runtime import preview without registering an application.
      reversible: true
      impact: Does not change applications or runtime state.
    confirmation:
      required: false
      strategy: none
      ttl: PT0S
  description: Resolves one ready runtime candidate into an inspect preview while reusing the application-owned import inspection pipeline.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/application-import-runtime-inspect-request.yaml
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Runtime candidate inspection result.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-application-import-runtime-inspect-response.yaml
    '400':
      description: Invalid runtime candidate inspection request.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '500':
      $ref: ../components/responses/internal-server-error.yaml
