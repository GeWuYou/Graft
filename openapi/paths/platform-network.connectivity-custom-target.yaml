delete:
  tags: [platform-network]
  summary: Delete a custom connectivity target
  operationId: deletePlatformConnectivityCustomTarget
  security: [{ bearerAuth: [] }]
  parameters:
    - name: targetId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    '204': { description: Target deleted. }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '404': { description: Target not found. }
