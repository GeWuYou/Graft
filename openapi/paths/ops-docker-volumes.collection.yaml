get:
  tags: [container]
  summary: List Docker volumes
  operationId: getDockerVolumes
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/docker-volume-list-limit.yaml
    - $ref: ../components/parameters/docker-volume-list-offset.yaml
    - $ref: ../components/parameters/docker-volume-list-keyword.yaml
    - $ref: ../components/parameters/docker-volume-list-driver.yaml
    - $ref: ../components/parameters/docker-volume-list-scope.yaml
    - $ref: ../components/parameters/docker-volume-list-usage.yaml
    - $ref: ../components/parameters/docker-volume-list-source.yaml
    - $ref: ../components/parameters/docker-volume-list-compose-project.yaml
  security: [{ bearerAuth: [] }]
  responses:
    '200': { description: Docker volume list., headers: { X-Request-Id: { $ref: ../components/headers/request-id.yaml } }, content: { application/json: { schema: { $ref: ../components/schemas/enveloped-docker-volume-list-response.yaml } } } }
    '400': { description: Invalid Docker volume list query., headers: { X-Request-Id: { $ref: ../components/headers/request-id.yaml } }, content: { application/json: { schema: { $ref: ../components/schemas/error-response.yaml } } } }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '500': { $ref: ../components/responses/internal-server-error.yaml }
