put:
  tags: [project]
  summary: Update a private project-list saved view
  operationId: putProjectSavedView
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/project-saved-view-id.yaml
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/project-saved-view-request.yaml
  responses:
    '200':
      description: Saved view updated.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-project-saved-view.yaml
    '400':
      description: Invalid saved-view state.
      content:
        application/json:
          schema: { $ref: ../components/schemas/error-response.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '404':
      description: Saved view was not found.
      content:
        application/json:
          schema: { $ref: ../components/schemas/error-response.yaml }
    '409':
      description: Duplicate saved-view name.
      content:
        application/json:
          schema: { $ref: ../components/schemas/error-response.yaml }
delete:
  tags: [project]
  summary: Delete a private project-list saved view
  operationId: deleteProjectSavedView
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/project-saved-view-id.yaml
  security:
    - bearerAuth: []
  responses:
    '204': { description: Saved view deleted. }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '404':
      description: Saved view was not found.
      content:
        application/json:
          schema: { $ref: ../components/schemas/error-response.yaml }
