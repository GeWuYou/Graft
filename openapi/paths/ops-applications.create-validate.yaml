post:
  tags: [application]
  summary: Validate a managed Compose application create request
  operationId: postApplicationCreateValidate
  x-graft-mcp:
    risk:
      level: low
      reason: Validates bounded create inputs without writing files or registering an application.
      reversible: true
      impact: Does not change applications or managed workspaces.
    confirmation:
      required: false
      strategy: none
      ttl: PT0S
  description: Validates managed-root authority, target paths, and bounded create inputs without writing files or registering an application.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/application-create-validate-request.yaml
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Managed create validation result.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-application-create-validate-response.yaml
    '400':
      description: Invalid managed create input, Compose configuration, managed-root authority, or reusable-workspace safety. The response code identifies the safe failure category and the trace id correlates the server diagnostic log.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '409':
      description: Managed create validation blocked by managed-root authority, ownership, or runtime guard.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '500':
      $ref: ../components/responses/internal-server-error.yaml
