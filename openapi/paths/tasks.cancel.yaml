post:
  tags: [tasks]
  summary: Request Task cancellation
  operationId: cancelTask
  description: >
    Requests cooperative cancellation. The Task Runtime persists the request before invoking the current StageExecutor
    cancel hook; completed external side effects are not automatically rolled back.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - in: path
      name: taskId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Updated Task detail.
      headers:
        X-Request-Id: { $ref: ../components/headers/request-id.yaml }
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-task-detail.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '404':
      description: Task was not found.
      headers:
        X-Request-Id: { $ref: ../components/headers/request-id.yaml }
      content:
        application/json:
          schema: { $ref: ../components/schemas/error-response.yaml }
    '409':
      description: Cancellation is not currently allowed by Task capabilities or state.
      headers:
        X-Request-Id: { $ref: ../components/headers/request-id.yaml }
      content:
        application/json:
          schema: { $ref: ../components/schemas/error-response.yaml }
    '500': { $ref: ../components/responses/internal-server-error.yaml }
