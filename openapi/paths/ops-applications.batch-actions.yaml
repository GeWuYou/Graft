post:
  tags: [application]
  summary: Execute application actions in batch
  operationId: postApplicationBatchActions
  description: >
    Executes one action for selected application ids and returns per-item results plus aggregate completed, blocked,
    and skipped counts. Nonexistent application_id values fail the request with 404, while skipped applies only to
    existing applications for which the requested action is not applicable.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/application-batch-action-request.yaml
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Application batch action result.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-application-batch-action-response.yaml
    '400':
      description: Invalid batch action request.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      description: One or more requested application_id values do not match an existing application record.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '500':
      $ref: ../components/responses/internal-server-error.yaml
