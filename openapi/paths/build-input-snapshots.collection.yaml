get:
  tags: [build]
  operationId: getBuildInputSnapshots
  summary: List reusable Build input snapshots
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    - in: query
      name: offset
      schema: { type: integer, minimum: 0, default: 0 }
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Reusable input snapshot page.
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-build-input-snapshot-list.yaml }
    '400': { $ref: ../components/responses/bad-request.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '500': { $ref: ../components/responses/internal-server-error.yaml }

post:
  tags: [build]
  operationId: postBuildInputSnapshot
  summary: Upload a Build input snapshot archive
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: ../components/schemas/build-input-snapshot-upload-request.yaml
  security:
    - bearerAuth: []
  responses:
    '201':
      description: Input Snapshot created or reused by content digest.
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-build-input-snapshot.yaml }
    '400': { $ref: ../components/responses/bad-request.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '500': { $ref: ../components/responses/internal-server-error.yaml }
