get:
  tags: [container]
  summary: Read Docker image
  operationId: getDockerImage
  parameters:
    - $ref: ../components/parameters/container-id-path.yaml
  security: [{ bearerAuth: [] }]
  responses:
    '200':
      description: Docker image.
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-docker-image.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '404': { description: Image not found }
    '500': { $ref: ../components/responses/internal-server-error.yaml }
