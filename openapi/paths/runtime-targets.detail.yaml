get:
  tags: [runtime-target]
  summary: Read runtime target
  operationId: getRuntimeTarget
  x-graft-mcp:
    resource_uri_templates:
      - graft://runtime-targets/{id}
    resource_uri_parameter_bindings:
      id: id
    risk:
      level: low
      reason: Reads one runtime target's existing configuration and status.
      reversible: true
      impact: Does not change runtime target state.
    confirmation:
      required: false
      strategy: none
      ttl: PT0S
  security: [{bearerAuth: []}]
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/runtime-target-id-path.yaml
  responses:
    '200':
      description: Runtime target detail.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-runtime-target-response.yaml
    '400': {description: Invalid target id}
    '401': {$ref: ../components/responses/unauthorized.yaml}
    '403': {$ref: ../components/responses/forbidden.yaml}
    '404': {description: Runtime target not found}
    '500': {$ref: ../components/responses/internal-server-error.yaml}
