get:
  tags: [registry]
  operationId: getRegistryArtifactRepositoryAssignments
  summary: List users assigned to an Artifact Repository
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/registry-connection-ref-path.yaml
    - $ref: ../components/parameters/registry-repository-ref-query.yaml
    - name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    - name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  security: [{bearerAuth: []}]
  responses:
    '200':
      description: Active Artifact Repository user assignments.
      content:
        application/json:
          schema: {$ref: ../components/schemas/enveloped-registry-artifact-repository-user-assignment-list-response.yaml}
    '401': {$ref: ../components/responses/unauthorized.yaml}
    '403': {$ref: ../components/responses/forbidden.yaml}
    '404': {$ref: ../components/responses/not-found.yaml}
    '500': {$ref: ../components/responses/internal-server-error.yaml}
post:
  tags: [registry]
  operationId: postRegistryArtifactRepositoryAssignment
  summary: Grant a user use of an Artifact Repository
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - $ref: ../components/parameters/registry-connection-ref-path.yaml
    - $ref: ../components/parameters/registry-repository-ref-query.yaml
  security: [{bearerAuth: []}]
  requestBody:
    required: true
    content:
      application/json:
        schema: {$ref: ../components/schemas/registry-artifact-repository-user-assignment-request.yaml}
  responses:
    '201':
      description: User assigned to the Artifact Repository.
      content:
        application/json:
          schema: {$ref: ../components/schemas/enveloped-registry-artifact-repository-user-assignment.yaml}
    '400': {$ref: ../components/responses/bad-request.yaml}
    '401': {$ref: ../components/responses/unauthorized.yaml}
    '403': {$ref: ../components/responses/forbidden.yaml}
    '404': {$ref: ../components/responses/not-found.yaml}
    '409': {$ref: ../components/responses/conflict.yaml}
    '500': {$ref: ../components/responses/internal-server-error.yaml}
