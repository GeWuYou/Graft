get:
  tags: [health]
  summary: Read platform capability health
  operationId: getPlatformCapabilities
  description: Returns the current server capability observations. This is a diagnostic projection and does not redirect platform availability.
  security: [{ bearerAuth: [] }]
  responses:
    '200':
      description: Current capability snapshot.
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-platform-capabilities-response.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '500': { $ref: ../components/responses/internal-server-error.yaml }
