post:
  tags: [application]
  summary: Inspect one import directory
  operationId: postApplicationImportInspect
  x-graft-mcp:
    risk:
      level: low
      reason: Produces a bounded import inspection preview without registering an application.
      reversible: true
      impact: Does not change applications, files, or runtime state.
    confirmation:
      required: false
      strategy: none
      ttl: PT0S
  description: Discovers compose and env files under the selected directory, parses the Compose application once, and returns a short-lived inspection snapshot for later import confirmation. Previewable naming or ownership conflicts are reported inside the 200 response body rather than as transport-level 409 errors.
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/application-import-inspect-request.yaml
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Import inspection result.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/enveloped-application-import-inspect-response.yaml
    '400':
      description: Invalid inspection request.
      headers:
        X-Request-Id:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error-response.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '500':
      $ref: ../components/responses/internal-server-error.yaml
