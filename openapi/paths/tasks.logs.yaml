get:
  tags: [tasks]
  summary: Replay Task logs
  operationId: listTaskLogs
  parameters:
    - $ref: ../components/parameters/locale-header.yaml
    - $ref: ../components/parameters/request-id-header.yaml
    - in: path
      name: taskId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    - in: query
      name: after_sequence
      schema: { type: integer, format: int64, minimum: 0, default: 0 }
      description: Return entries with a sequence strictly greater than this cursor. Mutually exclusive with before_sequence and tail=true.
    - in: query
      name: before_sequence
      schema: { type: integer, format: int64, minimum: 1 }
      description: Return entries with a sequence strictly earlier than this cursor. Results remain in ascending sequence order and this parameter is mutually exclusive with after_sequence and tail=true.
    - in: query
      name: tail
      schema: { type: boolean, default: false }
      description: Return the latest page of entries in ascending sequence order. Mutually exclusive with after_sequence and before_sequence when true.
    - in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Task log replay page.
      headers:
        X-Request-Id: { $ref: ../components/headers/request-id.yaml }
      content:
        application/json:
          schema: { $ref: ../components/schemas/enveloped-task-log-response.yaml }
    '400':
      description: Log cursor parameters are invalid or mutually exclusive.
      headers:
        X-Request-Id: { $ref: ../components/headers/request-id.yaml }
      content:
        application/json:
          schema: { $ref: ../components/schemas/error-response.yaml }
    '401': { $ref: ../components/responses/unauthorized.yaml }
    '403': { $ref: ../components/responses/forbidden.yaml }
    '404':
      description: Task was not found.
      headers:
        X-Request-Id: { $ref: ../components/headers/request-id.yaml }
      content:
        application/json:
          schema: { $ref: ../components/schemas/error-response.yaml }
    '500': { $ref: ../components/responses/internal-server-error.yaml }
