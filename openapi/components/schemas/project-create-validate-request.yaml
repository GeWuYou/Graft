type: object
required:
  - display_name
  - canonical_project_name
  - relative_project_directory
  - compose_file_name
properties:
  display_name:
    type: string
    minLength: 1
    maxLength: 120
  canonical_project_name:
    type: string
    minLength: 1
    maxLength: 120
    pattern: '^[a-z0-9][a-z0-9_-]*$'
  relative_project_directory:
    type: string
    minLength: 1
    maxLength: 255
    pattern: '^[^./\\\\][^\\\\]*(/[^./\\\\][^\\\\]*)*$'
    description: Relative project directory under the canonical managed root.
  compose_file_name:
    type: string
    minLength: 1
    maxLength: 255
    pattern: '^[^/\\\\]+$'
  env_file_name:
    type: string
    minLength: 1
    maxLength: 255
    pattern: '^[^/\\\\]+$'
    nullable: true
  workspace_files:
    type: array
    minItems: 1
    description: Complete managed workspace text manifest to validate without materializing.
    items:
      $ref: ./project-workspace-manifest-file.yaml
  compose_file_path:
    type: string
    minLength: 1
  env_file_paths:
    type: array
    items:
      type: string
      minLength: 1
  lifecycle_configuration:
    $ref: ./project-lifecycle-configuration-request.yaml
