type: object
required:
  - strategy_kind
  - profiles
  - down_before_redeploy
  - pull_before_redeploy
  - build_before_up
  - force_recreate
  - remove_orphans
  - wait_after_up
  - wait_timeout_seconds
  - renew_anon_volumes
  - prune_images_after_redeploy
  - generated_commands
  - additional_args
properties:
  strategy_kind:
    $ref: ./project-lifecycle-strategy-kind.yaml
  profiles:
    type: array
    items:
      type: string
      minLength: 1
    uniqueItems: true
  down_before_redeploy:
    type: boolean
  pull_before_redeploy:
    type: boolean
  build_before_up:
    type: boolean
  force_recreate:
    type: boolean
  remove_orphans:
    type: boolean
    default: true
  wait_after_up:
    type: boolean
  wait_timeout_seconds:
    type: integer
    minimum: 1
    maximum: 3600
    default: 120
  prune_images_after_redeploy:
    type: boolean
  renew_anon_volumes:
    type: boolean
    default: false
  additional_args:
    type: array
    items:
      type: string
  generated_commands:
    type: object
    required:
      - up
      - stop
      - restart
      - redeploy
    properties:
      up:
        $ref: ./project-lifecycle-generated-command.yaml
      stop:
        $ref: ./project-lifecycle-generated-command.yaml
      restart:
        $ref: ./project-lifecycle-generated-command.yaml
      redeploy:
        $ref: ./project-lifecycle-generated-command.yaml
    additionalProperties: false
additionalProperties: false
