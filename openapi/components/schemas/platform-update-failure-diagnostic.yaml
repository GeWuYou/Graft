type: object
description: "Immutable, sanitized diagnostic evidence for a failed self-update start request. It is never embedded in normal update-start error responses."
required: [request_id, target_version, failure_code, failure_stage, summary, detail, occurred_at]
properties:
  request_id: { type: string, description: "Request identifier that correlates this diagnostic with application and access logs." }
  operation_id: { type: string, description: "Update operation identifier when persistence completed before the failure." }
  task_id: { type: integer, format: int64, description: "Task runtime identifier when one was created before the failure." }
  target_version: { type: string, description: "Requested release version." }
  failure_code: { $ref: ./platform-update-rollout-failure-code.yaml }
  failure_stage: { type: string, description: "Server-side update-start stage that failed." }
  summary: { type: string, description: "Controlled operator-facing failure summary." }
  detail: { type: string, description: "Sanitized diagnostic detail with credentials, tokens, cookies, and DSN passwords redacted." }
  occurred_at: { type: string, format: date-time, description: "UTC time at which the update start failed." }
