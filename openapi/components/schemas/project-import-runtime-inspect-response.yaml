type: object
required:
  - inspection_id
  - candidate_key
  - resolved_working_directory
  - canonical_project_name
  - canonical_project_name_source
  - display_name_suggested
  - compose_files
  - env_files
  - services
  - networks
  - volumes
  - runtime_members
  - config_hash
  - warnings
  - conflicts
  - validation_status
properties:
  inspection_id:
    type: string
  candidate_key:
    type: string
  resolved_working_directory:
    type: string
  canonical_project_name:
    type: string
  canonical_project_name_source:
    $ref: ./project-canonical-name-source.yaml
  display_name_suggested:
    type: string
  compose_files:
    type: array
    items:
      $ref: ./project-import-inspect-file-item.yaml
  env_files:
    type: array
    items:
      $ref: ./project-import-inspect-file-item.yaml
  services:
    type: array
    items:
      type: string
  networks:
    type: array
    items:
      $ref: ./project-import-runtime-network-resource.yaml
  volumes:
    type: array
    items:
      $ref: ./project-import-runtime-volume-resource.yaml
  runtime_members:
    type: array
    items:
      $ref: ./project-import-runtime-member.yaml
  config_hash:
    type: string
  warnings:
    type: array
    items:
      type: string
  conflicts:
    type: array
    items:
      type: string
  validation_status:
    type: string
    enum: [ready, conflict]
