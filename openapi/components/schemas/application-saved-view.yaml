type: object
required: [id, name, query_state, page_size, visible_columns, is_default, created_at, updated_at]
properties:
  id:
    type: integer
    format: int64
    minimum: 1
  name:
    type: string
    minLength: 1
    maxLength: 120
  query_state:
    type: object
    additionalProperties: true
    description: Consumer-validated filter and query state. It never contains the current page number.
  page_size:
    type: integer
    minimum: 1
    maximum: 500
  visible_columns:
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 120
  is_default:
    type: boolean
    description: Whether this user view is applied by default for its list surface.
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
