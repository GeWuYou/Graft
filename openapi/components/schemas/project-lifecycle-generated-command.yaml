type: object
required:
  - action
  - steps
  - display_command
properties:
  action:
    type: string
    enum: [up, stop, restart, redeploy]
    x-enum-varnames:
      - ProjectLifecycleGeneratedCommandActionUp
      - ProjectLifecycleGeneratedCommandActionStop
      - ProjectLifecycleGeneratedCommandActionRestart
      - ProjectLifecycleGeneratedCommandActionRedeploy
  steps:
    type: array
    minItems: 1
    items:
      $ref: ./project-lifecycle-command-step.yaml
  display_command:
    type: string
    minLength: 1
    description: Combined preview for the selected lifecycle action.
additionalProperties: false
