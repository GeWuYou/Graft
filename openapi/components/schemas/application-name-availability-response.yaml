type: object
required: [status, workspace_path, workspace_non_empty]
properties:
  status:
    type: string
    enum: [available, registered, reusable_workspace]
  workspace_path:
    type: string
  workspace_non_empty:
    type: boolean
  workspace_entries:
    type: array
    items:
      $ref: ./application-workspace-entry.yaml
  compose_file_path:
    type: string
    nullable: true
