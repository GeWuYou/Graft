type: object
required: [key, strategy, updated_at]
properties:
  key:
    type: string
  strategy:
    type: string
    enum: [visible, hidden, ignore]
  updated_at:
    type: string
    format: date-time
  updated_by:
    type: [integer, "null"]
    format: int64
  updated_by_name:
    type: string
