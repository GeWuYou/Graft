type: object
required: [target_id, user_id, created_at]
properties:
  target_id:
    type: integer
    format: int64
    minimum: 1
  user_id:
    type: integer
    format: int64
    minimum: 1
  created_at:
    type: string
    format: date-time
  created_by:
    type: integer
    format: int64
    minimum: 0
  username:
    type: string
    description: Current username when the assigned user remains available.
  display:
    type: string
    description: Current display name when the assigned user remains available.
  status:
    type: string
    description: Current account status when the assigned user remains available.
