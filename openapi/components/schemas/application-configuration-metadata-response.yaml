type: object
required:
  - application_id
  - compose_files
  - env_files
  - ownership_mode
  - drift_status
properties:
  application_id:
    $ref: ./application-id.yaml
  compose_files:
    type: array
    items:
      $ref: ./application-file-item.yaml
  env_files:
    type: array
    items:
      $ref: ./application-file-item.yaml
  ownership_mode:
    $ref: ./application-ownership-mode.yaml
  drift_status:
    $ref: ./application-drift-status.yaml
  diagnostics_summary:
    type: array
    items:
      type: string
    description: Bounded configuration diagnostics summary for readonly UI display.
