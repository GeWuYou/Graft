type: object
required: [id, provider, displayName, endpointLabel, connectionKind, capabilities, availability, lastError]
properties:
  id:
    type: integer
    format: int64
  provider:
    type: string
    example: docker
  displayName:
    type: string
  endpointLabel:
    type: string
    description: Masked connection endpoint label. It never contains credentials.
  connectionKind:
    type: string
    example: unix_socket
  capabilities:
    type: array
    items:
      type: string
  availability:
    type: boolean
  lastCheckedAt:
    type: string
    format: date-time
    nullable: true
  lastError:
    type: string
    description: Sanitized latest probe diagnostic.
