allOf:
  - $ref: ./runtime-target-summary.yaml
  - type: object
    required: [health, providerDetails, agent]
    properties:
      agent:
        $ref: ./runtime-target-agent.yaml
      health:
        type: object
        required: [status, lastCheckedAt, diagnostic]
        properties:
          status:
            type: string
            enum: [healthy, unavailable]
            x-enum-varnames:
              - RuntimeTargetHealthStatusHealthy
              - RuntimeTargetHealthStatusUnavailable
          lastCheckedAt:
            type: string
            format: date-time
            nullable: true
          diagnostic:
            type: string
            description: Sanitized connection diagnostic; empty when healthy.
      providerDetails:
        type: object
        description: Provider-specific typed extension selected by the provider discriminator.
        required: [provider, docker]
        properties:
          provider:
            type: string
            enum: [docker]
          docker:
            type: object
            required: [images, volumes, networks]
            properties:
              images:
                $ref: ./runtime-target-image-metric.yaml
              volumes:
                $ref: ./runtime-target-image-metric.yaml
              networks:
                $ref: ./runtime-target-image-metric.yaml
        discriminator:
          propertyName: provider
          mapping:
            docker: ./runtime-target.yaml
