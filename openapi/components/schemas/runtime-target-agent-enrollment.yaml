type: object
additionalProperties: false
required: [agentId, generation, enrollmentRef, expiresAt, trustBundleVersion, status]
properties:
  agentId: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,127}$', description: Stable lowercase Agent identity identifier.}
  generation: {type: integer, format: int64, minimum: 1, description: Monotonically increasing certificate enrollment generation.}
  enrollmentRef: {type: string, minLength: 1, maxLength: 256, description: Opaque non-secret Vault enrollment reference.}
  expiresAt: {type: string, format: date-time, description: Enrollment reference expiry.}
  trustBundleVersion: {type: string, minLength: 1, maxLength: 128, description: Non-secret trust bundle version for managed deployment delivery.}
  status: {type: string, enum: [pending], description: The enrollment is not active until its certificate-bound generation is activated.}
