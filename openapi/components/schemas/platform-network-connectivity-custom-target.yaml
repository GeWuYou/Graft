type: object
required: [id, display_name, endpoint, enabled, created_at]
properties:
  id: { type: string, maxLength: 128, pattern: '^custom-[a-z0-9][a-z0-9-]{0,120}$' }
  display_name: { type: string, maxLength: 128 }
  endpoint: { type: string, format: uri, maxLength: 2048 }
  enabled: { type: boolean }
  created_at: { type: string, format: date-time }
