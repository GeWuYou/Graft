type: object
required:
  - id
  - display_name
  - application_type
  - canonical_project_name
  - canonical_project_name_source
  - lifecycle_review_status
  - source_kind
  - activity_authority
  - host_scope
  - ownership_mode
  - working_directory
  - drift_status
  - service_count
  - container_counts
properties:
  id:
    type: integer
    format: int64
    minimum: 1
  display_name:
    type: string
  application_type:
    type: string
    enum: [compose]
  runtime_target:
    $ref: ./project-runtime-target-summary.yaml
    nullable: true
  canonical_project_name:
    type: string
  canonical_project_name_source:
    $ref: ./project-canonical-name-source.yaml
  lifecycle_review_status:
    $ref: ./project-lifecycle-review-status.yaml
  source_kind:
    $ref: ./project-source-kind.yaml
  source_metadata:
    $ref: ./project-source-metadata.yaml
  activity_authority:
    $ref: ./project-activity-authority.yaml
  host_scope:
    $ref: ./project-host-scope.yaml
  ownership_mode:
    $ref: ./project-ownership-mode.yaml
  working_directory:
    type: string
  runtime_status:
    $ref: ./project-runtime-status.yaml
    nullable: true
    description: >
      Aggregated project status for overview consumption only. It must not become a replacement for
      container runtime detail authority.
  service_count:
    type: integer
    minimum: 0
  container_counts:
    $ref: ./project-container-counts.yaml
  drift_status:
    $ref: ./project-drift-status.yaml
