type: object
required:
  - application_id
  - display_name
  - application_type
  - compose_project_name
  - compose_project_name_source
  - lifecycle_review_status
  - source_kind
  - activity_authority
  - host_scope
  - ownership_mode
  - workspace_path
  - drift_status
  - service_count
  - container_counts
properties:
  application_id:
    type: string
  display_name:
    type: string
  application_type:
    type: string
    enum: [compose]
  runtime_target:
    $ref: ./project-runtime-target-summary.yaml
    nullable: true
  compose_project_name:
    type: string
  compose_project_name_source:
    $ref: ./project-canonical-name-source.yaml
  workspace_key:
    type: string
    nullable: true
  lifecycle_review_status:
    $ref: ./project-lifecycle-review-status.yaml
  source_kind:
    $ref: ./project-source-kind.yaml
  source_metadata:
    $ref: ./project-source-metadata.yaml
  activity_authority:
    $ref: ./project-activity-authority.yaml
  host_scope:
    $ref: ./project-host-scope.yaml
  ownership_mode:
    $ref: ./project-ownership-mode.yaml
  workspace_path:
    type: string
  runtime_status:
    $ref: ./project-runtime-status.yaml
    nullable: true
    description: >
      Aggregated project status for overview consumption only. It must not become a replacement for
      container runtime detail authority.
  service_count:
    type: integer
    minimum: 0
  container_counts:
    $ref: ./project-container-counts.yaml
  drift_status:
    $ref: ./project-drift-status.yaml
