type: object
required:
  - name
  - driver
  - scope
  - internal
  - containers
  - container_count
  - services
  - service_count
properties:
  name:
    type: string
  driver:
    type: [string, "null"]
  scope:
    type: [string, "null"]
  internal:
    type: [boolean, "null"]
  containers:
    type: array
    items:
      type: string
  container_count:
    type: integer
    minimum: 0
  services:
    type: array
    items:
      type: string
  service_count:
    type: integer
    minimum: 0
