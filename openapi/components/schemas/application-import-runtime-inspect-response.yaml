type: object
required:
  - inspection_id
  - expires_at
  - candidate_key
  - resolved_workspace_path
  - compose_project_name
  - compose_project_name_source
  - display_name_suggested
  - compose_files
  - env_files
  - services
  - networks
  - volumes
  - runtime_members
  - config_hash
  - warnings
  - conflicts
  - validation_status
  - lifecycle_configuration
properties:
  inspection_id:
    type: string
  expires_at:
    type: string
    format: date-time
    description: Absolute UTC expiration time for this short-lived inspection session.
  candidate_key:
    type: string
  resolved_workspace_path:
    type: string
  compose_project_name:
    type: string
  compose_project_name_source:
    $ref: ./application-compose-project-name-source.yaml
  display_name_suggested:
    type: string
  compose_files:
    type: array
    items:
      $ref: ./application-import-inspect-file-item.yaml
  env_files:
    type: array
    items:
      $ref: ./application-import-inspect-file-item.yaml
  services:
    type: array
    items:
      type: string
  networks:
    type: array
    items:
      $ref: ./application-import-runtime-network-resource.yaml
  volumes:
    type: array
    items:
      $ref: ./application-import-runtime-volume-resource.yaml
  runtime_members:
    type: array
    items:
      $ref: ./application-import-runtime-member.yaml
  config_hash:
    type: string
  warnings:
    type: array
    items:
      type: string
  conflicts:
    type: array
    items:
      type: string
  validation_status:
    type: string
    enum: [ready, conflict]
  lifecycle_configuration:
    $ref: ./application-lifecycle-configuration-request.yaml
