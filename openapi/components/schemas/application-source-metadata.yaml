type: object
additionalProperties: false
properties:
  managed_root_key:
    type: string
    description: Canonical config key that owns the managed application root.
  managed_relative_directory:
    type: string
    description: Relative directory currently owned by the managed application root.
  managed_compose_file_name:
    type: string
    description: Canonical managed compose file name tracked by application authority.
  managed_env_file_name:
    type: string
    nullable: true
    description: Optional managed env file name tracked by application authority.
  template_id:
    type: string
    description: Stable Application Template identity that originated this application.
  template_version_id:
    type: string
    description: Immutable published Application Template version that originated this application.
