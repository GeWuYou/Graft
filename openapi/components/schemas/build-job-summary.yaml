type: object
required: [build_id, task_id, input_snapshot_id, input_snapshot_digest, source_kind, created_at, builder, execution]
properties:
  build_id: { type: string }
  task_id: { type: integer, format: int64, minimum: 1 }
  input_snapshot_id: { type: string }
  input_snapshot_digest: { type: string }
  source_kind: { type: string }
  application_id: { $ref: ./application-id.yaml, nullable: true }
  application_name: { type: string, nullable: true }
  context_path: { type: string }
  dockerfile_path: { type: string }
  image_repository: { type: string }
  image_tag: { type: string }
  created_at: { type: string, format: date-time }
  builder: { $ref: ./build-builder-snapshot.yaml }
  execution: { $ref: ./build-task-execution.yaml }
  artifact: { $ref: ./build-job-artifact.yaml }
additionalProperties: false
