type: object
properties:
  readme_markdown:
    type: string
    maxLength: 65535
  variables:
    type: array
    maxItems: 100
    items:
      type: object
      required: [name, required, description]
      properties:
        name:
          type: string
          pattern: '^[A-Z_][A-Z0-9_]*$'
        required: { type: boolean }
        description: { type: string, maxLength: 512 }
