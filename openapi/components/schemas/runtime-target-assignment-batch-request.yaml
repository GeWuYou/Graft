type: object
required: [target_ids, user_ids, action]
properties:
  target_ids:
    type: array
    minItems: 1
    maxItems: 1000
    items: {type: integer, format: int64, minimum: 1}
  user_ids:
    type: array
    minItems: 1
    maxItems: 10000
    items: {type: integer, format: int64, minimum: 1}
  action:
    type: string
    enum: [grant, revoke]
