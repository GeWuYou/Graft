type: object
required: [items, total, limit, offset, summary]
properties:
  items:
    type: array
    items:
      $ref: ./runtime-target-summary.yaml
  total:
    type: integer
    format: int64
    minimum: 0
  limit:
    type: integer
    minimum: 1
  offset:
    type: integer
    minimum: 0
  summary:
    type: object
    required: [total, healthy, unavailable]
    properties:
      total:
        type: integer
        format: int64
        minimum: 0
      healthy:
        type: integer
        format: int64
        minimum: 0
      unavailable:
        type: integer
        format: int64
        minimum: 0
