type: object
required: [publication_id, artifact_id, digest, media_type, destination, credential_execution_mode, created_at]
properties:
  publication_id: { type: string, minLength: 1, maxLength: 64 }
  artifact_id: { type: string, minLength: 1, maxLength: 64 }
  digest: { type: string, pattern: '^sha256:.+$' }
  media_type: { type: string, minLength: 1, maxLength: 255 }
  destination:
    type: object
    required: [kind, connection_ref, repository_ref, reference]
    properties:
      kind: { type: string, enum: [oci_registry] }
      connection_ref: { type: string, minLength: 1, maxLength: 255 }
      repository_ref: { type: string, minLength: 1, maxLength: 255 }
      reference: { type: string, minLength: 1, maxLength: 255 }
    additionalProperties: false
  credential_execution_mode: { type: string, minLength: 1, maxLength: 128 }
  created_at: { type: string, format: date-time }
additionalProperties: false
