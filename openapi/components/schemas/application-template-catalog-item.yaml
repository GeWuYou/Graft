type: object
required: [template_id, display_name, description, category, deployment_adapter_kind, updated_at, version]
properties:
  template_id: { type: string }
  display_name: { type: string }
  description: { type: string }
  category:
    $ref: ./application-template-category.yaml
  deployment_adapter_kind: { type: string, enum: [compose] }
  updated_at:
    type: string
    format: date-time
  version:
    type: object
    required: [template_version_id, version_number, published_at]
    properties:
      template_version_id: { type: string }
      version_number: { type: integer, minimum: 1 }
      published_at:
        type: string
        format: date-time
