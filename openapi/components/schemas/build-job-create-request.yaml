type: object
required: [workspace_id, template_ref, driver, destination]
properties:
  workspace_id:
    type: string
    minLength: 1
    maxLength: 64
  runtime_target_id:
    type: integer
    format: int64
    minimum: 1
    description: Direct Runtime Target selection. Provide exactly one of runtime_target_id or builder_pool_id.
  builder_pool_id:
    type: string
    minLength: 1
    maxLength: 64
    description: Build-owned Builder Pool selection. Provide exactly one of builder_pool_id or runtime_target_id.
  template_ref:
    type: string
    enum: [oci-dockerfile/default@v1]
  driver:
    type: string
    enum: [docker-engine@v1, docker-buildx@v1]
    description: docker-buildx@v1 is required when platforms contains more than one platform.
  platforms:
    type: array
    minItems: 1
    maxItems: 8
    description: A multi-platform request requires docker-buildx@v1 and a Builder Pool so Build can freeze one placement per platform.
    items: { type: string, pattern: '^linux/[a-z0-9]+(?:/[a-z0-9]+)?$' }
  destination:
    type: object
    required: [kind, connection_ref, repository_ref, reference]
    properties:
      kind: { type: string, enum: [oci_registry] }
      connection_ref: { type: string, minLength: 1, maxLength: 255 }
      repository_ref: { type: string, minLength: 1, maxLength: 255 }
      reference: { type: string, minLength: 1, maxLength: 255 }
    additionalProperties: false
additionalProperties: false
