type: object
required: [items]
properties:
  items:
    type: array
    items:
      type: object
      required: [id, level, title_key]
      properties:
        id:
          type: string
        level:
          type: string
          enum: [info, warning, error]
        title_key:
          type: string
          description: Authoritative stable localization key for the alert title.
        title:
          type: string
          description: Optional fallback title used only when the client cannot resolve title_key.
        description_key:
          type: string
        description:
          type: string
        count:
          type: integer
          minimum: 1
        occurred_at:
          type: string
          format: date-time
        action_label_key:
          type: string
          description: Optional key-first action label for this alert row.
        action_label:
          type: string
          description: Optional fallback action label for this alert row.
        route_location:
          type: string
  empty_key:
    type: string
  empty:
    type: string
