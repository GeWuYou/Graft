type: object
required: [display_name, endpoint, enabled, insecure]
properties:
  display_name:
    type: string
    minLength: 1
    maxLength: 128
  endpoint:
    type: string
    format: uri
    minLength: 1
    maxLength: 512
    description: Generic OCI endpoint without userinfo, query, fragment, or embedded credentials.
  credential_ref:
    type: string
    minLength: 1
    maxLength: 255
    nullable: true
    writeOnly: true
    description: Replaces or clears the opaque managed credential reference. It is never returned.
  enabled:
    type: boolean
  insecure:
    type: boolean
  description:
    type: string
    maxLength: 1024
    nullable: true
additionalProperties: false
