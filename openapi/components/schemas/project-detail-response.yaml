allOf:
  - $ref: ./project-list-item.yaml
  - type: object
    required:
      - lifecycle_configuration
      - compose_files
      - env_files
    properties:
      source_metadata:
        $ref: ./project-source-metadata.yaml
      lifecycle_configuration:
        $ref: ./project-lifecycle-configuration.yaml
      last_observed_config_hash:
        type: string
      last_drift_checked_at:
        type: string
        format: date-time
        nullable: true
      compose_files:
        type: array
        items:
          $ref: ./project-file-item.yaml
      env_files:
        type: array
        items:
          $ref: ./project-file-item.yaml
