type: object
required:
  - candidate_key
properties:
  candidate_key:
    type: string
    minLength: 1
  display_name:
    type: string
    minLength: 1
    maxLength: 120
  compose_project_name_override:
    type: string
    maxLength: 120
    minLength: 1
    pattern: '^[a-z0-9][a-z0-9_-]*$'
    nullable: true
