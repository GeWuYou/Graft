type: object
required:
  - kind
  - role
  - absolute_path
  - display_path
  - order_index
properties:
  kind:
    $ref: ./application-file-kind.yaml
  role:
    $ref: ./application-file-role.yaml
  absolute_path:
    type: string
  display_path:
    type: string
  order_index:
    type: integer
    minimum: 0
  last_observed_hash:
    type: string
    nullable: true
