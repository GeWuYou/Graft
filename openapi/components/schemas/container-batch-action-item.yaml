type: object
required:
  - id
  - accepted
  - action
properties:
  id:
    type: string
  name:
    type: string
  action:
    type: string
    enum: [start, stop, restart, remove]
    x-enum-varnames:
      - ContainerBatchActionItemActionStart
      - ContainerBatchActionItemActionStop
      - ContainerBatchActionItemActionRestart
      - ContainerBatchActionItemActionRemove
  accepted:
    type: boolean
    description: Whether this item was accepted as an independent Container lifecycle Task.
  task_id:
    type: integer
    format: int64
    minimum: 1
    description: Independent lifecycle Task identifier when accepted is true.
  status:
    $ref: ./task-status.yaml
    description: Initial Task Runtime status when accepted is true.
  error_code:
    type: string
  message_key:
    type: string
  message:
    type: string
additionalProperties: false
