type: object
required:
  - project_id
  - canonical_project_name
  - entries
  - tail
  - timestamps
  - stdout
  - stderr
  - truncated
properties:
  project_id:
    type: integer
    format: int64
    minimum: 1
  canonical_project_name:
    type: string
  entries:
    type: array
    items:
      $ref: ./project-log-entry.yaml
  tail:
    type: integer
    minimum: 1
  since:
    type: string
    nullable: true
  timestamps:
    type: boolean
  stdout:
    type: boolean
  stderr:
    type: boolean
  truncated:
    type: boolean
