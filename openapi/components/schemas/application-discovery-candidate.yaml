type: object
required:
  - candidate_key
  - candidate_kind
  - source_type
  - display_name
  - compose_project_name
  - compose_project_name_source
  - workspace_path
  - ownership_mode
  - status
  - recommended_action
  - compose_files
  - env_files
  - declared_service_names
  - service_count
  - config_hash
  - warnings
  - conflicts
properties:
  candidate_key:
    type: string
  candidate_kind:
    $ref: ./application-discovery-candidate-kind.yaml
  source_type:
    $ref: ./application-source-type.yaml
  source_metadata:
    $ref: ./application-source-metadata.yaml
  display_name:
    type: string
  compose_project_name:
    type: string
  compose_project_name_source:
    $ref: ./application-compose-project-name-source.yaml
  workspace_path:
    type: string
  ownership_mode:
    $ref: ./application-ownership-mode.yaml
  status:
    $ref: ./application-discovery-candidate-status.yaml
  recommended_action:
    type: string
    enum: [review, import]
    x-enum-varnames:
      - ApplicationDiscoveryCandidateActionReview
      - ApplicationDiscoveryCandidateActionImport
  status_reason:
    type: string
    nullable: true
  compose_files:
    type: array
    items:
      $ref: ./application-file-item.yaml
  env_files:
    type: array
    items:
      $ref: ./application-file-item.yaml
  declared_service_names:
    type: array
    items:
      type: string
  service_count:
    type: integer
    minimum: 0
  config_hash:
    type: string
  warnings:
    type: array
    items:
      type: string
  conflicts:
    type: array
    items:
      type: string
