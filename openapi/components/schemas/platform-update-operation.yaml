type: object
required: [operation_id, operation, runner_id, source_version, target_version, deployment_strategy, phase, progress, message, state_source, state_available, started_at, updated_at]
properties:
  operation_id: { type: string }
  operation: { type: string, enum: [self_update] }
  runner_id: { type: string }
  source_version: { type: string }
  target_version: { type: string }
  deployment_strategy: { $ref: ./platform-deployment-strategy.yaml }
  phase: { type: string, enum: [READY, PREFLIGHT, BACKUP, PULL_IMAGES, STOP_SERVICES, APPLY_UPDATE, MIGRATION, START_SERVICES, HEALTH_CHECK, SUCCESS, FAILED, ROLLBACK] }
  progress: { type: integer, minimum: 0, maximum: 100 }
  message: { type: string, description: "Controlled runner message key; never raw command output or deployment secrets." }
  state_source: { type: string, enum: [runner_state, terminal_history, runner_state_unavailable, runner_lost, runner_terminated], description: "Authority that produced this projection. runner_state_unavailable, runner_lost, and legacy runner_terminated never represent live runner progress; runner_lost means the runner's durable lease expired before it published a terminal snapshot." }
  state_available: { type: boolean, description: "Whether runner lifecycle state was available to verify this projection. runner_lost and legacy runner_terminated projections are explicitly unavailable even when they retain the last verified snapshot fields." }
  error: { type: string, description: "Controlled runner failure code; never raw command output or deployment secrets." }
  failure_diagnostic_available: { type: boolean, description: "Whether a manager may retrieve controlled failure diagnostics for this operation." }
  started_at: { type: string, format: date-time }
  updated_at: { type: string, format: date-time }
  finished_at: { type: string, format: date-time }
