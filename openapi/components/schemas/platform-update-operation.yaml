type: object
required: [operation_id, source_version, target_version, task_id, status, recovery_completed, created_at, started_at]
properties:
  operation_id: { type: string }
  source_version: { type: string }
  target_version: { type: string }
  update_policy: { $ref: ./platform-update-policy.yaml }
  task_id: { type: integer, format: int64 }
  backup_id: { type: integer, format: int64 }
  requested_by: { type: integer, format: int64 }
  status: { type: string, enum: [PLANNING, BACKING_UP, PULLING, MIGRATING, RECREATING, VERIFYING, SUCCESS, FAILED, RECOVERED, NEEDS_ATTENTION] }
  failure_code: { type: string }
  failure_diagnostic_available: { type: boolean, description: "Whether a manager may retrieve controlled failure diagnostics for this operation." }
  recovery_completed: { type: boolean }
  created_at: { type: string, format: date-time }
  started_at: { type: string, format: date-time }
  finished_at: { type: string, format: date-time }
