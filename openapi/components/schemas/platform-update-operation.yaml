type: object
required: [operation_id, operation, runner_id, source_version, target_version, deployment_strategy, phase, progress, message, started_at, updated_at]
properties:
  operation_id: { type: string }
  operation: { type: string, enum: [self_update] }
  runner_id: { type: string }
  source_version: { type: string }
  target_version: { type: string }
  deployment_strategy: { $ref: ./platform-deployment-strategy.yaml }
  phase: { type: string, enum: [READY, PREFLIGHT, BACKUP, PULL_IMAGES, STOP_SERVICES, APPLY_UPDATE, MIGRATION, START_SERVICES, HEALTH_CHECK, SUCCESS, FAILED, ROLLBACK] }
  progress: { type: integer, minimum: 0, maximum: 100 }
  message: { type: string, description: "Controlled runner message key; never raw command output or deployment secrets." }
  error: { type: string, description: "Controlled runner failure code; never raw command output or deployment secrets." }
  failure_diagnostic_available: { type: boolean, description: "Whether a manager may retrieve controlled failure diagnostics for this operation." }
  started_at: { type: string, format: date-time }
  updated_at: { type: string, format: date-time }
  finished_at: { type: string, format: date-time }
