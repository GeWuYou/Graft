type: object
required:
  - managed_root
  - source_type
  - application_type
  - application_id
  - action
  - result
  - display_name
  - compose_project_name
  - ownership_mode
  - workspace_path
  - compose_file_name
  - compose_file_absolute_path
  - snapshot_summary
properties:
  managed_root:
    $ref: ./application-managed-root-response.yaml
  source_type:
    $ref: ./application-source-type.yaml
  application_type:
    $ref: ./application-type.yaml
  application_id:
    $ref: ./application-id.yaml
  action:
    type: string
    enum: [create]
    x-enum-varnames:
      - ApplicationCreateResponseActionCreate
  result:
    type: string
    enum: [created]
    x-enum-varnames:
      - ApplicationCreateResponseResultCreated
  display_name:
    type: string
  compose_project_name:
    type: string
  application_name:
    type: string
    nullable: true
  ownership_mode:
    $ref: ./application-ownership-mode.yaml
  workspace_path:
    type: string
  compose_file_name:
    type: string
  compose_file_absolute_path:
    type: string
  env_file_name:
    type: string
    nullable: true
  env_file_absolute_path:
    type: string
    nullable: true
  source_metadata:
    $ref: ./application-source-metadata.yaml
  snapshot_summary:
    type: object
    required:
      - config_hash
      - refreshed_at
    properties:
      config_hash:
        type: string
      refreshed_at:
        type: string
        format: date-time
      declared_service_count:
        type: integer
        minimum: 0
  message_key:
    type: string
    nullable: true
  message:
    type: string
    nullable: true
  warnings:
    type: array
    items:
      type: string
