type: object
required:
  - project_id
  - lifecycle_review_status
  - working_directory
  - canonical_project_name
  - compose_files
  - lifecycle_configuration
properties:
  project_id:
    type: integer
    format: int64
    minimum: 1
  lifecycle_review_status:
    $ref: ./project-lifecycle-review-status.yaml
  working_directory:
    type: string
    description: Read-only working directory authority reused by lifecycle command generation.
  canonical_project_name:
    type: string
    description: Read-only project runtime identity used for explicit `docker compose -p`.
  compose_files:
    type: array
    items:
      $ref: ./project-file-item.yaml
    description: Ordered tracked Compose files reused by lifecycle command generation.
  lifecycle_configuration:
    $ref: ./project-lifecycle-configuration.yaml
additionalProperties: false
