type: object
required:
  - action
  - application_ids
properties:
  action:
    type: string
    enum: [start, stop, restart, unregister, redeploy, destroy]
    x-enum-varnames:
      - ProjectBatchActionRequestActionStart
      - ProjectBatchActionRequestActionStop
      - ProjectBatchActionRequestActionRestart
      - ProjectBatchActionRequestActionUnregister
      - ProjectBatchActionRequestActionRedeploy
      - ProjectBatchActionRequestActionDestroy
  application_ids:
    type: array
    minItems: 1
    maxItems: 100
    items:
      type: string
      pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
  remove_named_volumes:
    type: boolean
    default: false
  auto_unregister:
    type: boolean
    default: false
  image_prune:
    type: boolean
    default: false
  delete_working_directory:
    type: boolean
    default: false
  confirm_canonical_project_name:
    type: string
    minLength: 1
additionalProperties: false
