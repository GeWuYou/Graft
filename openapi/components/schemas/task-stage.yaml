type: object
required: [id, key, sequence, executor_type, status, attempt, max_attempts, recovery_policy]
properties:
  id: { type: integer, format: int64, minimum: 1 }
  key:
    type: string
    description: Stable plan-local Stage key used in the timeline.
  sequence: { type: integer, minimum: 1 }
  executor_type:
    type: string
    description: Consumer-owned StageExecutor type, such as project.compose.pull.
  status: { $ref: ./task-stage-status.yaml }
  attempt: { type: integer, minimum: 0 }
  max_attempts: { type: integer, minimum: 1 }
  recovery_policy:
    type: string
    enum: [manual_reconcile, retry_if_idempotent]
  started_at: { type: string, format: date-time, nullable: true }
  finished_at: { type: string, format: date-time, nullable: true }
  duration_ms: { type: integer, format: int64, minimum: 0, nullable: true }
  failure_code: { type: string, nullable: true }
  failure_message: { type: string, nullable: true }
