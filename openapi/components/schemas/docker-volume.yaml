type: object
required: [name, driver, scope, created_at]
properties:
  name: { type: string }
  driver: { type: string }
  scope: { type: string }
  created_at: { type: string }
  labels: { type: object, additionalProperties: { type: string } }
  reference_count: { type: integer, format: int64, nullable: true }
  size_bytes: { type: integer, format: int64, nullable: true }
