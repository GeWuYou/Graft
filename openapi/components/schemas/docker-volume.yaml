type: object
required: [name, driver, scope, created_at, container_references]
properties:
  name: { type: string }
  driver: { type: string }
  scope: { type: string }
  created_at: { type: string }
  labels: { type: object, additionalProperties: { type: string } }
  reference_count: { type: integer, format: int64, nullable: true }
  size_bytes: { type: integer, format: int64, nullable: true }
  container_references:
    type: array
    description: Containers currently referencing this volume, represented as sanitized display references.
    items:
      $ref: ./docker-volume-container-reference.yaml
