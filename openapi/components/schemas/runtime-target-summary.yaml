type: object
required: [id, displayName, runtime, connection, health, resources]
properties:
  id:
    type: integer
    format: int64
  displayName:
    type: string
  runtime:
    type: object
    required: [provider, type, version, apiVersion, operatingSystem, hostName]
    properties:
      provider:
        type: string
        enum: [docker]
      type:
        type: string
        enum: [container_runtime]
      version:
        type: string
      apiVersion:
        type: string
      operatingSystem:
        type: string
      hostName:
        type: string
  connection:
    type: object
    required: [endpoint, kind]
    properties:
      endpoint:
        type: string
        description: Masked connection endpoint. It never contains credentials.
      kind:
        type: string
        enum: [unix_socket]
  health:
    type: object
    required: [status, lastCheckedAt, diagnostic]
    properties:
      status:
        type: string
        enum: [healthy, unavailable]
        x-enum-varnames:
          - RuntimeTargetSummaryHealthStatusHealthy
          - RuntimeTargetSummaryHealthStatusUnavailable
      lastCheckedAt:
        type: string
        format: date-time
        nullable: true
      diagnostic:
        type: string
        description: Sanitized connection diagnostic; empty when healthy.
  resources:
    type: object
    required: [workloads, cpu, memory, storage]
    properties:
      workloads:
        $ref: ./runtime-target-count-metric.yaml
      cpu:
        $ref: ./runtime-target-usage-metric.yaml
      memory:
        $ref: ./runtime-target-usage-metric.yaml
      storage:
        $ref: ./runtime-target-usage-metric.yaml
