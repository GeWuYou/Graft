type: object
required: [code, kind, title, icon, permission]
dependentRequired:
  section_key: [section_title_key]
properties:
  code:
    type: string
  parent_code:
    type: string
    description: Explicit parent navigation group code. Navigation hierarchy is never inferred from path.
  kind:
    type: string
    enum: [group, entry]
  order:
    type: integer
    description: Canonical menu order declared by the backend. Lower values render first within the same parent.
  title:
    type: string
    description: Existing menu-title fallback text. Consumers should prefer title_key when present.
  title_key:
    type: string
    description: Stable menu title localization key owned by the menu contract. When present, it is the canonical title field and title is fallback-only.
  section_key:
    type: string
    description: Optional visual-only sidebar section identity. It never creates a route, permission, tab, breadcrumb, or menu node.
  section_title_key:
    type: string
    description: Stable localization key for section_key. Required when section_key is present.
  path:
    type: string
    description: Required for entry nodes and absent for group nodes.
  icon:
    type: string
  permission:
    type: string
