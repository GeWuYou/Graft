type: object
required: [id, name, driver, scope, created_at, internal, attachable, ingress, container_count, source, label_groups]
properties:
  id: { type: string }
  name: { type: string }
  driver: { type: string }
  scope: { type: string }
  created_at: { type: string }
  internal: { type: boolean }
  attachable: { type: boolean }
  ingress: { type: boolean }
  container_count: { type: integer, minimum: 0 }
  removable: { type: boolean }
  labels: { type: object, additionalProperties: { type: string } }
  source: { $ref: ./docker-network-source.yaml }
  label_groups: { $ref: ./docker-network-label-groups.yaml }
