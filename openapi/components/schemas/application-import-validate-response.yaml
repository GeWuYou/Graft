type: object
required:
  - workspace_path
  - compose_files
  - env_files
  - compose_project_name
  - compose_project_name_source
  - service_count
  - warnings
  - conflicts
properties:
  workspace_path:
    type: string
  compose_files:
    type: array
    items:
      $ref: ./application-file-item.yaml
  env_files:
    type: array
    items:
      $ref: ./application-file-item.yaml
  compose_project_name:
    type: string
  compose_project_name_source:
    $ref: ./application-compose-project-name-source.yaml
  normalized_preview_summary:
    type: object
    properties:
      config_hash:
        type: string
      declared_service_names:
        type: array
        items:
          type: string
  service_count:
    type: integer
    minimum: 0
  warnings:
    type: array
    items:
      type: string
  conflicts:
    type: array
    items:
      type: string
