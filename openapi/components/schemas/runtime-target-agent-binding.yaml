type: object
additionalProperties: false
required: [agentId, generation, status, providerId, builderScopeId, capabilityProfile, certificateFingerprint, certificateSerial, trustBundleVersion, expiresAt]
properties:
  agentId: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,127}$'}
  generation: {type: integer, format: int64, minimum: 1}
  status: {type: string, enum: [pending, active, revoked, retired]}
  providerId: {type: string, minLength: 1, maxLength: 128}
  builderScopeId: {type: string, minLength: 1, maxLength: 128}
  capabilityProfile: {type: string, minLength: 1, maxLength: 128}
  certificateFingerprint: {type: string, pattern: '^sha256:[a-f0-9]{64}$', description: Public certificate fingerprint; never a certificate or private key.}
  certificateSerial: {type: string, minLength: 1, maxLength: 256}
  trustBundleVersion: {type: string, minLength: 1, maxLength: 128}
  expiresAt: {type: string, format: date-time}
  revokedAt: {type: string, format: date-time, nullable: true}
  auditCorrelationId: {type: string, minLength: 1, maxLength: 128, description: Redacted audit correlation identifier for the latest binding transition.}
