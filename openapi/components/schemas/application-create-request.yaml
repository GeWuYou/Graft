type: object
required:
  - display_name
  - runtime_target_id
  - application_name
  - workspace_entries
  - compose_file_path
properties:
  display_name:
    type: string
    minLength: 1
    maxLength: 120
  runtime_target_id:
    type: integer
    format: int64
    minimum: 1
  application_name:
    type: string
    maxLength: 255
    pattern: '^[a-z0-9][a-z0-9-]*$'
    description: Required unique machine-safe application name. It owns the managed directory and becomes the Compose project name when the Compose file does not declare one.
  workspace_entries:
    type: array
    minItems: 1
    description: Complete managed workspace manifest. It supports arbitrary UTF-8 text files and directories, including empty directories.
    items:
      $ref: ./application-workspace-entry.yaml
  compose_file_path:
    type: string
    minLength: 1
    maxLength: 1024
    pattern: '^[^/\\\\][^\\\\]*$'
    description: Explicit workspace-relative primary Compose file reference. The server normalizes the path and rejects paths that escape the workspace.
  reuse_existing_workspace:
    type: boolean
    default: false
    description: Explicitly confirms that a previously inspected, unregistered managed directory may receive the submitted workspace changes.
  lifecycle_configuration:
    $ref: ./application-lifecycle-configuration-request.yaml
  template_version_id:
    type: string
    description: Optional immutable published Application Template version that originally prefilled this editable workspace.
