type: object
required:
  - application_id
  - compose_project_name
  - health
  - resources
  - services
properties:
  application_id:
    type: string
  compose_project_name:
    type: string
  collected_at:
    type: string
    format: date-time
    nullable: true
  health:
    $ref: ./project-overview-health-summary.yaml
  resources:
    $ref: ./project-overview-resource-summary.yaml
  services:
    type: array
    items:
      $ref: ./project-overview-service-item.yaml
