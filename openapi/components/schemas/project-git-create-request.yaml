type: object
additionalProperties: false
required:
  - display_name
  - canonical_project_name
  - relative_project_directory
  - repository_url
properties:
  display_name:
    type: string
    minLength: 1
  canonical_project_name:
    type: string
    minLength: 1
  relative_project_directory:
    type: string
    minLength: 1
  repository_url:
    type: string
    minLength: 1
    description: Public or locally reachable Git repository URL. Credentials are never accepted or persisted.
  reference:
    type: string
    description: Optional branch, tag, or commit reference. Defaults to HEAD.
  compose_subpath:
    type: string
    description: Optional repository-relative directory containing the primary Compose file. Defaults to the repository root.
  lifecycle_configuration:
    $ref: ./project-lifecycle-configuration-request.yaml
