type: object
required: [name, query_state, page_size, visible_columns]
properties:
  name:
    type: string
    minLength: 1
    maxLength: 120
  query_state:
    type: object
    additionalProperties: false
    description: Application-list filter state. The server validates this payload for the application saved-view surface.
    properties:
      keyword:
        type: string
        minLength: 1
        maxLength: 128
      deployment_adapter_kind:
        type: string
        enum: [compose]
      runtime_target_id:
        type: integer
        format: int64
        minimum: 1
      provider:
        type: string
        enum: [docker]
      source_type:
        $ref: ./application-source-type.yaml
      runtime_status:
        $ref: ./application-runtime-status.yaml
      drift_status:
        $ref: ./application-drift-status.yaml
      sort:
        type: array
        maxItems: 1
        description: Optional application-list sort expression; omitted values use created_at:desc.
        items:
          type: string
          enum: [created_at:desc, created_at:asc]
  page_size:
    type: integer
    minimum: 1
    maximum: 500
  visible_columns:
    type: array
    maxItems: 10
    items:
      type: string
      enum:
        - row-select
        - name
        - applicationType
        - runtimeTarget
        - provider
        - source
        - runtime
        - resources
        - drift
        - operation
      minLength: 1
  is_default:
    type: boolean
    default: false
    description: Whether this view becomes the user's default for this list surface.
