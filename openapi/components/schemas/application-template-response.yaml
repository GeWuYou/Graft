type: object
required: [template_id, display_name, description, category, deployment_adapter_kind, updated_at, version]
properties:
  template_id: { type: string }
  display_name: { type: string }
  description: { type: string }
  category:
    $ref: ./application-template-category.yaml
  deployment_adapter_kind: { type: string, enum: [compose] }
  updated_at:
    type: string
    format: date-time
  archived_at:
    type: [string, "null"]
    format: date-time
  version:
    $ref: ./application-template-version.yaml
