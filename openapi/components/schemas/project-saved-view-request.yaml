type: object
required: [name, query_state, page_size, visible_columns]
properties:
  name:
    type: string
    minLength: 1
    maxLength: 120
  query_state:
    type: object
    additionalProperties: false
    description: Project-list filter state. The server validates this payload for the project saved-view surface.
    properties:
      keyword:
        type: string
        minLength: 1
        maxLength: 128
      application_type:
        type: string
        enum: [compose]
      runtime_target_id:
        type: integer
        format: int64
        minimum: 1
      provider:
        type: string
        enum: [docker]
      source_kind:
        $ref: ./project-source-kind.yaml
      runtime_status:
        $ref: ./project-runtime-status.yaml
      drift_status:
        $ref: ./project-drift-status.yaml
  page_size:
    type: integer
    minimum: 1
    maximum: 500
  visible_columns:
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 120
