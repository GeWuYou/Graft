type: object
required:
  - inspection_id
  - lifecycle_configuration
properties:
  inspection_id:
    type: string
    minLength: 1
  display_name:
    type: string
    minLength: 1
    maxLength: 120
  compose_project_name_override:
    type: [string, "null"]
    maxLength: 120
    minLength: 1
    pattern: '^[a-z0-9][a-z0-9_-]*$'
  lifecycle_configuration:
    $ref: ./application-lifecycle-configuration-request.yaml
