type: object
required: [target_version, confirmation]
properties:
  target_version: { type: string, minLength: 1, maxLength: 128 }
  confirmation: { type: string, minLength: 1, maxLength: 128, description: Exact target_version typed by the administrator. }
  compose_candidate_key:
    type: string
    minLength: 1
    maxLength: 256
    description: Opaque server-issued Compose root candidate key. Required only when the installation profile uses Docker discovery.
