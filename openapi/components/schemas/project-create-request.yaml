type: object
required:
  - display_name
  - runtime_target_id
  - workspace_entries
  - compose_file_path
properties:
  display_name:
    type: string
    minLength: 1
    maxLength: 120
  runtime_target_id:
    type: integer
    format: int64
    minimum: 1
  workspace_key:
    type: string
    maxLength: 255
    pattern: '^[a-z0-9][a-z0-9-]*$'
    description: Optional single-segment managed workspace key. The server derives and reserves a key when omitted.
  workspace_entries:
    type: array
    minItems: 1
    description: Complete managed workspace manifest. It supports arbitrary UTF-8 text files and directories, including empty directories.
    items:
      $ref: ./project-workspace-entry.yaml
  compose_file_path:
    type: string
    minLength: 1
    maxLength: 1024
    pattern: '^[^/\\\\][^\\\\]*$'
    description: Explicit workspace-relative primary Compose file reference. The server normalizes the path and rejects paths that escape the workspace.
  lifecycle_configuration:
    $ref: ./project-lifecycle-configuration-request.yaml
