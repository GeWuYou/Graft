type: object
required: [name, query_state, page_size, visible_columns]
properties:
  name:
    type: string
    minLength: 1
    maxLength: 120
  query_state:
    type: object
    additionalProperties: true
  page_size:
    type: integer
    minimum: 1
    maximum: 200
  visible_columns:
    type: array
    maxItems: 100
    items:
      type: string
  is_default:
    type: boolean
    default: false
    description: Whether this view becomes the user's default for this list surface.
