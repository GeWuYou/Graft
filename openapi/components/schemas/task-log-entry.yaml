type: object
required: [id, sequence, stream, level, line, occurred_at]
properties:
  id: { type: integer, format: int64, minimum: 1 }
  sequence: { type: integer, format: int64, minimum: 1 }
  stage_id: { type: integer, format: int64, minimum: 1, nullable: true }
  stream: { type: string, enum: [stdout, stderr, system] }
  level: { type: string, enum: [info, warn, error] }
  line: { type: string }
  occurred_at: { type: string, format: date-time }
