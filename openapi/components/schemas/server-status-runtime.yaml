type: object
required:
  - go_version
  - host_name
  - operating_system
  - architecture
  - cpu_cores
  - load_average
  - disk_usage
  - host_memory_total_bytes
  - host_memory_used_bytes
  - host_memory_available_bytes
  - host_memory_used_percent
  - goroutines
  - runtime_alloc_bytes
  - runtime_heap_in_use_bytes
  - runtime_sys_bytes
  - runtime_gc_cycles
  - runtime_last_gc_at
  - runtime_last_gc_pause_ns
  - runtime_gc_pause_total_ns
  - runtime_next_gc_bytes
  - runtime_heap_objects
  - runtime_heap_released_bytes
  - runtime_stack_in_use_bytes
properties:
  go_version:
    type: string
  host_name:
    type: string
  operating_system:
    type: string
  architecture:
    type: string
  cpu_cores:
    type: integer
  load_average:
    $ref: ./server-status-load-average.yaml
  disk_usage:
    $ref: ./server-status-disk-usage.yaml
  host_memory_total_bytes:
    type: integer
    format: int64
    description: Total host memory in bytes.
  host_memory_used_bytes:
    type: integer
    format: int64
    description: Host memory used by programs in bytes.
  host_memory_available_bytes:
    type: integer
    format: int64
    description: Host memory available for program allocation in bytes, including reclaimable cache when reported by the operating system.
  host_memory_used_percent:
    type: number
    description: Percentage of host memory used by programs.
  goroutines:
    type: integer
  runtime_alloc_bytes:
    type: integer
    format: int64
  runtime_heap_in_use_bytes:
    type: integer
    format: int64
  runtime_sys_bytes:
    type: integer
    format: int64
  runtime_gc_cycles:
    type: integer
  runtime_last_gc_at:
    type: string
    format: date-time
    nullable: true
    description: UTC timestamp of the most recently completed Go garbage collection cycle; null before the first cycle.
  runtime_last_gc_pause_ns:
    type: integer
    format: int64
    nullable: true
    description: Stop-the-world pause duration in nanoseconds for the most recently completed Go garbage collection cycle; null before the first cycle.
  runtime_gc_pause_total_ns:
    type: integer
    format: int64
    description: Cumulative Go garbage collection pause duration in nanoseconds for the current process.
  runtime_next_gc_bytes:
    type: integer
    format: int64
    description: Heap allocation target in bytes that will trigger the next Go garbage collection cycle.
  runtime_heap_objects:
    type: integer
    format: int64
    description: Number of allocated heap objects tracked by the Go runtime.
  runtime_heap_released_bytes:
    type: integer
    format: int64
    description: Heap bytes returned by the Go runtime to the operating system.
  runtime_stack_in_use_bytes:
    type: integer
    format: int64
    description: Bytes occupied by Go stacks currently in use.
example:
  go_version: go1.25.1
  host_name: graft-dev
  operating_system: linux
  architecture: amd64
  cpu_cores: 8
  load_average:
    one_minute: 0.57
    five_minutes: 0.44
    fifteen_minutes: 0.38
  disk_usage:
    path: /
    total_bytes: 512110190592
    used_bytes: 187904819200
    free_bytes: 324205371392
    used_percent: 36.69
  host_memory_total_bytes: 34359738368
  host_memory_used_bytes: 16819159040
  host_memory_available_bytes: 17540579328
  host_memory_used_percent: 48.95
  goroutines: 37
  runtime_alloc_bytes: 62914560
  runtime_heap_in_use_bytes: 35651584
  runtime_sys_bytes: 100663296
  runtime_gc_cycles: 18
  runtime_last_gc_at: '2026-05-24T08:04:59Z'
  runtime_last_gc_pause_ns: 245760
  runtime_gc_pause_total_ns: 4915200
  runtime_next_gc_bytes: 75497472
  runtime_heap_objects: 18432
  runtime_heap_released_bytes: 8388608
  runtime_stack_in_use_bytes: 1048576
