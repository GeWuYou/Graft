type: object
required: [current_version, channel, installation_profile]
properties:
  current_version: { type: string }
  channel: { type: string, enum: [stable, beta, unknown] }
  latest:
    type: object
    required: [version, channel, notes, published_at, manifest_url, server_digest, web_digest]
    properties:
      version: { type: string }
      channel: { type: string, enum: [stable, beta] }
      notes: { type: string }
      published_at: { type: string, format: date-time }
      manifest_url: { type: string, format: uri }
      notes_url: { type: string, format: uri }
      upgrade_notes: { type: string }
      minimum_source_version: { type: string }
      server_digest: { type: string }
      web_digest: { type: string }
      checksums_url: { type: string, format: uri }
      asset_sha256:
        type: object
        additionalProperties: { type: string }
  installation_profile:
    type: object
    required: [declared_mode, detected_mode, capability, guidance, compose_root_source, compose_candidates]
    properties:
      declared_mode: { type: string, enum: [compose, binary, unknown] }
      detected_mode: { type: string, enum: [compose, binary] }
      capability: { type: string, enum: [compose_upgrade_available, manual_guidance, manual_guidance_blocked] }
      guidance: { type: string }
      binary_path: { type: string }
      web_root: { type: string }
      service_manager: { type: string, enum: [systemd, manual] }
      service_name: { type: string }
      manual_steps:
        type: array
        items:
          type: object
          required: [key]
          properties:
            key: { type: string }
            params:
              type: object
              additionalProperties: { type: string }
      blocking_reason: { type: string }
      compose_root_source: { $ref: ./platform-update-compose-root-source.yaml }
      compose_candidates:
        type: array
        description: Opaque Compose candidates and host paths for an authenticated platform-update.manage caller. Read-only callers receive an empty array.
        items: { $ref: ./platform-update-compose-root-candidate.yaml }
  checked_at: { type: string, format: date-time }
  last_successful_at: { type: string, format: date-time }
  cache_stale: { type: boolean }
  check_error: { type: string }
