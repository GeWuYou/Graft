name: tail
in: query
required: false
description: Number of aggregated project log lines to return from the end of the project stream.
schema:
  type: integer
  minimum: 1
  maximum: 1000
  default: 200
examples:
  defaultTail:
    summary: Default project tail window
    value: 200
  maxTail:
    summary: Maximum accepted project tail window
    value: 1000
