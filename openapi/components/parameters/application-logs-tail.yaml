name: tail
in: query
required: false
description: Number of aggregated application log lines to return from the end of the application stream.
schema:
  type: integer
  minimum: 1
  maximum: 1000
  default: 200
examples:
  defaultTail:
    summary: Default application tail window
    value: 200
  maxTail:
    summary: Maximum accepted application tail window
    value: 1000
