name: limit
in: query
required: false
description: Optional maximum number of runtime import candidates to return. The runtime accepts values from 1 to 100.
schema:
  type: integer
  minimum: 1
  maximum: 100
examples:
  defaultWindow:
    summary: Fetch the default runtime import candidate window
    value: 10
  maxWindow:
    summary: Fetch up to the maximum supported window
    value: 100
