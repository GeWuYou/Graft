name: usage
in: query
required: false
description: Optional Docker volume lifecycle status filter. The abnormal value aggregates server-owned unknown and exception relationship states.
schema:
  type: string
  enum: [used, unused, abnormal]
  x-enum-varnames:
    - DockerVolumeListUsageUsed
    - DockerVolumeListUsageUnused
    - DockerVolumeListUsageAbnormal
