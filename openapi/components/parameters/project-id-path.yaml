name: id
in: path
required: true
description: Public Graft application identifier. The internal project registry key is never accepted on HTTP routes.
schema:
  type: string
  pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
examples:
  applicationId:
    summary: Imported application id
    value: app_01JZ5R6M7N8P9Q0R1S2T3V4W5X
